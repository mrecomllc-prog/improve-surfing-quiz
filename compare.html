<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Improve Surfing — 4 direções de design</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:26px 22px 60px}
header{max-width:1560px;margin:0 auto 22px}
h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
.lede{color:#8b949e;font-size:14px;margin-top:7px;line-height:1.5;max-width:780px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.controls span{font-size:12px;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-right:4px}
button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 15px;border-radius:8px;
  border:1px solid #30363d;background:#161b22;color:#e6edf3;cursor:pointer;transition:.15s}
button:hover{border-color:#58a6ff;color:#fff}
button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.grid{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:1360px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.pane{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pane h2{font-size:14px;font-weight:800;padding:13px 15px 4px;display:flex;align-items:center;gap:9px}
.pane h2 i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pane .desc{font-size:11.5px;color:#8b949e;padding:0 15px 12px;line-height:1.45;min-height:58px}
.frame{position:relative;width:100%;aspect-ratio:430/860;background:#000;border-top:1px solid #30363d}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pane footer{padding:11px 15px;border-top:1px solid #30363d;display:flex;gap:8px}
.pane footer a{flex:1;text-align:center;font-size:12px;font-weight:600;text-decoration:none;
  color:#e6edf3;background:#21262d;border:1px solid #30363d;border-radius:7px;padding:8px;transition:.15s}
.pane footer a:hover{border-color:#58a6ff;color:#fff}
.a i{background:#00e0c8}.b i{background:#116b8a}.c i{background:#ff5a36}.d i{background:#c8f24e}
</style>
</head>
<body>
<header>
  <h1>Improve Surfing — 4 direções de design</h1>
  <p class="lede">O mesmo funil, os mesmos ecrãs e a mesma copy — só muda a linguagem visual.
  Cada painel é o quiz <b>a sério e navegável</b> (clica dentro e faz scroll). Usa os botões para saltar
  os 4 ao mesmo ecrã e comparar. “Abrir só este” abre a direção em ecrã inteiro.</p>
  <div class="controls">
    <span>Ecrã</span>
    <button data-j="" class="on">Intro</button>
    <button data-j="q5">Pergunta</button>
    <button data-j="ms1">Checkpoint</button>
    <button data-j="loader">Análise</button>
    <button data-j="score">Surf Score</button>
    <button data-j="projection">Projeção</button>
    <button data-j="result">Resultado</button>
    <button data-j="plans">Planos</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
const THEMES=[
 {k:'a',name:'A · Deep Ocean',desc:'Escuro premium tipo app de performance (Whoop/Strava). Superfícies em vidro, aqua elétrico, tipografia Sora, fotografia com grade frio.'},
 {k:'b',name:'B · Salt & Paper',desc:'Editorial claro. Papel quente, tinta azul-oceano, títulos em serif (Fraunces), cantos rectos e traços finos em vez de sombras.'},
 {k:'c',name:'C · Sunrise Session',desc:'Quente e enérgico. Base creme, gradiente coral→âmbar, teal profundo, formas muito redondas e sombras coloridas.'},
 {k:'d',name:'D · Performance Lab',desc:'Atlético/técnico. Quase-preto, lima elétrico, títulos condensados em maiúsculas, números em mono. Lê-se como instrumento de medição.'}
];
const grid=document.getElementById('grid');
grid.innerHTML=THEMES.map(t=>`
  <div class="pane ${t.k}">
    <h2><i></i>${t.name}</h2>
    <div class="desc">${t.desc}</div>
    <div class="frame"><iframe id="f${t.k}" src="index.html?theme=${t.k}"></iframe></div>
    <footer><a href="index.html?theme=${t.k}" target="_blank">Abrir só este ↗</a></footer>
  </div>`).join('');

document.querySelectorAll('.controls button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.controls button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const j=b.dataset.j;
    THEMES.forEach(t=>{
      document.getElementById('f'+t.k).src='index.html?theme='+t.k+(j?'&jump='+j:'');
    });
  };
});
</script>
</body>
</html>
