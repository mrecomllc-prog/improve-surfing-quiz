<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>What's Your Surf Score? — Improve Surfing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GLASSWATER — soft premium light design system
   Layered white cards · aqua gradient · coral reserved for loss
   Every selector name is preserved; only the appearance changed.
   ============================================================ */
:root{
  /* — Glasswater core —
     Two aqua ramps on purpose:
       --grad     → fills / icons  (white on it ≥ 3.7 : passes AA non-text)
       --grad-ink → gradient TEXT  (≥ 5.3 on white   : passes AA text)
     --aq1 is the accent *text* aqua, so it is a stop darker than the fill ramp. */
  --ink:#0f2530; --mut:#4f6774; --aq1:#0e7490; --aq2:#0ea5e9;
  --grad:linear-gradient(135deg,#0891b2,#0284c7);
  --grad-ink:linear-gradient(135deg,#0e7490,#0369a1);
  --coral:#ea580c; --coral-deep:#c2410c; --coral-ink:#9a3412; --coral-bg:#fff1ea; --coral-line:#ffd9c6;
  --card:#ffffff;
  --sh1:0 1px 2px rgba(15,37,48,.05),0 10px 28px -8px rgba(15,37,48,.12);
  --sh2:0 2px 4px rgba(15,37,48,.06),0 22px 48px -12px rgba(15,37,48,.18);
  --sh3:0 3px 6px rgba(15,37,48,.07),0 32px 64px -16px rgba(15,37,48,.24);
  --spring:cubic-bezier(.22,1.1,.36,1);
  --over:cubic-bezier(.34,1.7,.5,1);
  --ring:0 0 0 4px rgba(14,165,233,.14);
  --soft:linear-gradient(135deg,#e0f5fb,#d2ebfa);
  /* — legacy token names, re-pointed at the Glasswater palette — */
  --bg:#eef7fa; --bg2:#e7f0f7; --bg3:#dceaf3;
  --surface:#ffffff; --surface2:#f1f8fb;
  --line:rgba(15,37,48,.08); --line2:rgba(15,37,48,.055);
  --text:#0f2530; --dim:#4f6774; --mute:#5f7987;  /* --mute is the *tertiary text* grey: still AA on a white card */
  --aqua:#0891b2; --aqua-deep:#0e7490; --blue:#0ea5e9; --blue-deep:#0284c7; --navy:#0b2a38;
  --orange:#ea580c; --orange-deep:#c2410c;
  --green:#22c55e; --green-deep:#16a34a;
  --red:#ea580c; --red-deep:#9a3412;            /* the JS sets an invalid field to var(--red) */
  --gold:#b45309;                               /* amber: ★ glyphs are text-sized, so they need 4.5:1 — #b45309 is 4.7 on white, 4.4 on the wash */
  --gold-on-dark:#ffdfa1;                       /* the same semantic gold, on the deep aqua prize field: measured 4.84:1 at 375px and 4.64:1 at 320px (a 9.5px kicker is normal text → 4.5 minimum) */
  --f:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  /* the ONE empty-meter track. The same pillar meter is drawn on the loader, the score
     screen and the checkpoint — three hard-coded greys read as three components. */
  --track:rgba(15,37,48,.09);
  --track-warn:#ffdcca;                         /* its limiter variant, likewise single-sourced */
  --shadow:var(--sh3); --shadow-card:var(--sh1);
  --shadow-btn:inset 0 1.5px 0 rgba(255,255,255,.35),0 14px 32px -8px rgba(8,145,178,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* height:100% on body pinned it to the viewport: #shell is a flex item, so tall screens
   (score, plans) were clipped with nothing to scroll. min-height lets the page grow. */
html{height:100%}
html,body{background:#eef7fa;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.opt,.plan,.gcard,.acard,.cta,.skiplink{touch-action:manipulation} /* kill double-tap zoom delay on mobile */
body{font-family:var(--f);font-weight:500;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100%}
/* fixed mist layer — two radial washes over a cool vertical gradient */
body:before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 620px at 88% -8%, rgba(14,165,233,.17), transparent 62%),
    radial-gradient(720px 520px at -12% 34%, rgba(251,146,60,.11), transparent 60%),
    linear-gradient(180deg,#eef7fa,#e7f0f7);
}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus{outline:none}
/* opaque aqua — the old rgba(8,145,178,.45) composited to #90cddc (1.75:1) on the light card.
   --aq1 IS #0e7490: the ring is the accent, so it says so instead of repeating the hex. */
:focus-visible{outline:3px solid var(--aq1);outline-offset:2px;border-radius:14px;box-shadow:0 0 0 7px rgba(14,165,233,.18)}
#shell{width:100%;max-width:460px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1}

/* desktop — the column becomes a floating rounded panel */
@media(min-width:768px){
  body{padding:28px 0}
  #shell{
    min-height:calc(100vh - 56px);
    background:linear-gradient(180deg,#f6fbfd,#edf4f9);
    /* clip (not hidden) on the x axis only: keeps the plans carousel inside the rounded
       panel without trapping the y axis, which used to cut long screens off mid-content */
    border-radius:44px;overflow-x:clip;overflow-y:visible;
    box-shadow:0 4px 10px rgba(15,37,48,.05),0 50px 100px -20px rgba(15,37,48,.28);
  }
}

/* ---------- top bar (light) ---------- */
/* the header sits directly on the page wash — no surface, no blur layer (nothing scrolls under it) */
#topbar{padding:calc(16px + env(safe-area-inset-top)) 22px 10px;background:transparent}
#topbar .bar{background:var(--track)}
#topbar .qcount{color:var(--mut)}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
.brand .mark{width:30px;height:30px;object-fit:contain;display:block}
.brand .wm{font-size:10.5px;letter-spacing:.22em;font-weight:700;color:var(--mut);text-transform:uppercase}
.brand .wm b{color:var(--ink);font-weight:800}
.progress-wrap{display:flex;flex-direction:column;gap:9px}
/* Glasswater signature: a dot rail whose live section stretches into a 28px pill */
.dots{display:flex;gap:7px;justify-content:center}
/* the rail IS the progress signal, so an inactive dot is a meaningful graphical object and
   owes 3:1. #c2d6e1 measured 1.38:1 on the #eef7fa wash. Measured, not guessed: #9fb7c5
   only reaches 1.92:1 — #758d9d is 3.19:1 at the top of the wash and 3.01:1 at the bottom,
   so it clears the floor everywhere the rail actually appears, and still reads as "not yet"
   beside the 28px aqua pill (which carries the state by width and hue, not by weight). */
.dots i{width:8px;height:8px;border-radius:99px;background:#758d9d;transition:width .45s var(--spring),background .45s}
.dots i.on{width:28px;background:var(--grad)}
.barrow{display:flex;align-items:center;gap:0}
/* demoted to a hairline sub-rail — the dots now carry the signal */
.bar{flex:1;height:4px;background:var(--track);border-radius:99px;box-shadow:inset 0 1px 2px rgba(15,37,48,.07)}
.bar>i{display:block;height:100%;width:0%;background:var(--grad);border-radius:99px;transition:width .5s var(--spring)}
.qcount{font-size:10.5px;font-weight:700;color:var(--mut);white-space:nowrap;letter-spacing:.04em}
.qcount:not(:empty){margin-left:10px}   /* collapse the gap while the counter is blank */

#app{flex:1;padding:10px 22px 42px;display:flex;flex-direction:column}
.step{animation:stepIn .35s ease both;display:flex;flex-direction:column;flex:1}
@keyframes stepIn{from{opacity:0}to{opacity:1}}
/* staggered entrance — every screen cascades in */
.step>*{animation:childIn .62s var(--spring) backwards}
.step>*:nth-child(2){animation-delay:.05s}.step>*:nth-child(3){animation-delay:.10s}
.step>*:nth-child(4){animation-delay:.15s}.step>*:nth-child(5){animation-delay:.20s}
.step>*:nth-child(6){animation-delay:.25s}.step>*:nth-child(7){animation-delay:.30s}
.step>*:nth-child(8){animation-delay:.35s}.step>*:nth-child(9){animation-delay:.40s}
@keyframes childIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
/* loader / score / projection wrap their whole screen in one element,
   so the .step>* ladder above only ever matched a single node — cascade inside them too */
.loader-wrap>*,.reveal-wrap>*{animation:childIn .62s var(--spring) backwards}
.loader-wrap>*:nth-child(2),.reveal-wrap>*:nth-child(2){animation-delay:.05s}
.loader-wrap>*:nth-child(3),.reveal-wrap>*:nth-child(3){animation-delay:.10s}
.loader-wrap>*:nth-child(4),.reveal-wrap>*:nth-child(4){animation-delay:.15s}
.loader-wrap>*:nth-child(5),.reveal-wrap>*:nth-child(5){animation-delay:.20s}
.loader-wrap>*:nth-child(6),.reveal-wrap>*:nth-child(6){animation-delay:.25s}
.loader-wrap>*:nth-child(7),.reveal-wrap>*:nth-child(7){animation-delay:.30s}
.loader-wrap>*:nth-child(8),.reveal-wrap>*:nth-child(8){animation-delay:.35s}
.loader-wrap>*:nth-child(9),.reveal-wrap>*:nth-child(9){animation-delay:.40s}
.loader-wrap>*:nth-child(10),.reveal-wrap>*:nth-child(10){animation-delay:.45s}
.opts .opt{animation:optIn .55s var(--spring) backwards}
.opts .opt:nth-child(1){animation-delay:.12s}.opts .opt:nth-child(2){animation-delay:.19s}
.opts .opt:nth-child(3){animation-delay:.26s}.opts .opt:nth-child(4){animation-delay:.33s}
.opts .opt:nth-child(5){animation-delay:.40s}.opts .opt:nth-child(6){animation-delay:.47s}
@keyframes optIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.gcard,.acard{animation:optIn .55s var(--spring) backwards}
.gcards .gcard:nth-child(2),.acards .acard:nth-child(2){animation-delay:.08s}
.acards .acard:nth-child(3){animation-delay:.16s}.acards .acard:nth-child(4){animation-delay:.24s}
.plans .plan{animation:optIn .55s var(--spring) backwards}
.plans .plan:nth-child(2){animation-delay:.08s}.plans .plan:nth-child(3){animation-delay:.16s}.plans .plan:nth-child(4){animation-delay:.24s}

/* ambient ocean drift (kept, retuned to the aqua/peach wash) */
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
/* three blurred, permanently-compositing layers were running on phones for no visible gain —
   body::before already paints the specified page wash. Desktop keeps the ambience. */
.bgfx i{display:none;position:absolute;border-radius:50%;filter:blur(50px);opacity:.5}
@media(min-width:768px) and (prefers-reduced-motion:no-preference){.bgfx i{display:block}}
.bgfx .b1{width:340px;height:340px;background:radial-gradient(circle,rgba(14,165,233,.16),transparent 70%);top:-80px;left:-90px;animation:drift1 16s ease-in-out infinite alternate}
.bgfx .b2{width:300px;height:300px;background:radial-gradient(circle,rgba(8,145,178,.13),transparent 70%);bottom:-70px;right:-80px;animation:drift2 19s ease-in-out infinite alternate}
.bgfx .b3{width:230px;height:230px;background:radial-gradient(circle,rgba(251,146,60,.10),transparent 70%);top:38%;right:-60px;animation:drift3 22s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(70px,50px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-60px,-45px) scale(1.1)}}
@keyframes drift3{to{transform:translate(-45px,60px) scale(1.2)}}

/* ---------- type ---------- */
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--aq1);font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.eyebrow:before{content:"";width:18px;height:3px;background:var(--grad);border-radius:99px;flex-shrink:0}
h1{font-size:30px;line-height:1.14;font-weight:800;letter-spacing:-.028em;margin-bottom:12px;color:var(--ink)}
h1 .hl,.intro-h .hl,.reveal-headline .hl{
  background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
h1 .red{color:var(--coral)}
.sub{font-size:14.5px;line-height:1.55;color:var(--mut);font-weight:500;margin-bottom:24px}
.sub b{color:var(--ink);font-weight:700}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:11px;margin-top:2px}
.opt{display:flex;align-items:center;gap:13px;background:var(--card);border:2px solid rgba(15,37,48,.05);border-radius:22px;padding:16px 18px;min-height:66px;cursor:pointer;text-align:left;box-shadow:var(--sh1);transition:transform .3s var(--spring),box-shadow .3s,border-color .3s}
.opt:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.opt:active{transform:scale(.985)}
.opt.sel{
  transform:translateY(-3px);border-color:transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;
  box-shadow:var(--sh2),var(--ring);
}
.opt .tick{width:24px;height:24px;border-radius:50%;border:2px solid rgba(15,37,48,.34);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s}
.opt.sel .tick{border-color:transparent;background:var(--grad);box-shadow:0 6px 14px -5px rgba(8,145,178,.55)}
.opt.sel .tick:after{content:"";width:10px;height:5.5px;border:2.4px solid #fff;border-top:0;border-right:0;border-radius:1px;transform:rotate(-45deg) translate(1px,-1px)}
.opt .txt{font-size:14.5px;font-weight:700;line-height:1.38;color:var(--ink)}
/* Glasswater signature #8 — the 46px soft icon circle, on the funnel's most-repeated element */
.opt .emoji{flex:0 0 46px;width:46px;height:46px;border-radius:50%;background:var(--soft);box-shadow:inset 0 0 0 1px rgba(8,145,178,.14);display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;transition:background .25s}
.opt.sel .emoji{background:linear-gradient(135deg,#cdeefa,#bfe3f8);box-shadow:inset 0 0 0 1px rgba(8,145,178,.3)}
.opt .emoji.ic svg{display:block}

/* ---------- gender cards ---------- */
.gcards{display:flex;gap:12px;margin-top:4px}
.gcard{flex:1;background:var(--card);border:2px solid rgba(15,37,48,.05);border-radius:24px;padding:0 0 15px;cursor:pointer;overflow:hidden;box-shadow:var(--sh1);transition:transform .3s var(--spring),box-shadow .3s,border-color .3s;text-align:center}
.gcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.gcard.sel{
  transform:translateY(-3px);border-color:transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;
  box-shadow:var(--sh2),var(--ring);
}
.gcard .gname{font-size:15px;font-weight:800;margin-top:13px;color:var(--ink);letter-spacing:-.01em}
.gcard.alt{flex:none;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:16px;margin-top:11px;color:var(--mut);font-weight:700;font-size:14px;border-radius:20px}

/* Glasswater signature #4 — the springing gradient check, on the photo cards too.
   Both screens auto-advance in 430ms, so this badge is the tap's only confirmation. */
.gcard:after,.acard:after{content:"";position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--grad);box-shadow:0 8px 18px -6px rgba(8,145,178,.55);opacity:0;transform:scale(.3);transition:opacity .25s,transform .4s var(--over);z-index:2}
.gcard:before,.acard:before{content:"";position:absolute;top:22px;right:20px;width:11px;height:6px;border:2.4px solid #fff;border-top:0;border-right:0;border-radius:1px;opacity:0;transform:rotate(-45deg) scale(.3);transition:opacity .25s,transform .4s var(--over);z-index:3}
.gcard.sel:after,.acard.sel:after{opacity:1;transform:scale(1)}
.gcard.sel:before,.acard.sel:before{opacity:1;transform:rotate(-45deg) scale(1)}

/* ---------- buttons ---------- */
.cta{
  display:block;margin-top:auto;width:100%;border:0;cursor:pointer;text-align:center;
  min-height:58px;padding:18px 20px;border-radius:99px;
  /* the .24 scrim is load-bearing: it drags white-on-aqua from 3.5 up to 4.9 (AA at 17px) */
  background:linear-gradient(rgba(3,50,70,.24),rgba(3,50,70,.24)),var(--grad);
  color:#fff;font-weight:800;font-size:17px;letter-spacing:-.01em;
  box-shadow:var(--shadow-btn);
  transition:transform .25s var(--spring),box-shadow .25s;
}
.cta:hover{transform:translateY(-2px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 20px 40px -10px rgba(8,145,178,.55)}
.cta:active{transform:scale(.97)}
.cta:disabled{opacity:.42;filter:grayscale(.4);cursor:not-allowed;box-shadow:none;transform:none}
/* secondary treatment — kept for screens that already have a gradient primary.
   The ring is now .55 alpha: at .22 it resolved to ~#c6e3ec, ~1.2:1 on the wash. */
.cta.green{
  background:var(--card);color:var(--aq1);
  box-shadow:var(--sh2),inset 0 0 0 2px rgba(8,145,178,.55);
}
.cta.green:hover{box-shadow:var(--sh2),inset 0 0 0 2px rgba(8,145,178,.75)}
.btnnote{text-align:center;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:12px}
.btnnote b{color:var(--aq1);font-weight:800}

/* ---------- image slots ---------- */
.imgslot{width:100%;border-radius:22px;object-fit:cover;display:block;box-shadow:var(--sh2);filter:saturate(1.03) contrast(1.02)}
.imgslot.ph{background:linear-gradient(135deg,#e3eff6,var(--surface2));border:1.5px dashed rgba(15,37,48,.12);box-shadow:none;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:11px;letter-spacing:.05em;padding:10px;line-height:1.4;font-weight:700}
.ar-hero{aspect-ratio:16/9;border-radius:26px;margin:2px -6px 0;width:calc(100% + 12px)}
.ar-port{aspect-ratio:3/4}.ar-wide{aspect-ratio:16/9}.ar-card{aspect-ratio:4/5}
.imgslot.ph.ar-hero{min-height:150px}
.imgslot.ph.ar-wide{min-height:120px}

/* ---------- age image cards (2x2) ---------- */
.acards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2px}
.acard{background:var(--card);border:2px solid rgba(15,37,48,.05);border-radius:24px;padding:0 0 12px;cursor:pointer;overflow:hidden;box-shadow:var(--sh1);transition:transform .3s var(--spring),box-shadow .3s,border-color .3s;text-align:center}
.acard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.acard.sel{
  transform:translateY(-3px);border-color:transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;
  box-shadow:var(--sh2),var(--ring);
}
.acard .imgslot{border-radius:0;box-shadow:none;margin:0;width:100%}
.acard .imgslot.ph{font-size:10px;min-height:96px;border:0}
.acard .aname{font-size:13.5px;font-weight:800;margin-top:10px;color:var(--ink)}

/* ---------- intro (layered depth: headline → hero → floating stats) ---------- */
.intro-badge{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--aq1);font-size:11px;font-weight:800;padding:9px 15px;border-radius:99px;margin-bottom:10px;letter-spacing:.13em;text-transform:uppercase;box-shadow:var(--sh1)}
.intro-badge:before{content:"";width:7px;height:7px;border-radius:99px;background:var(--grad);flex-shrink:0}
/* 36px overflowed both target viewports (doc 1033 at 375, CTA top 928 — 116px below the
   fold). The whole intro block is retuned ~120px shorter so the button lands above it. */
.intro-h{font-size:31px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin:4px 0 10px;color:var(--ink)}
.intro-h .red{color:var(--coral)}
/* the hero climbs -30px and the pill sits -13px above that, so the pill's top edge lands
   43px into this block — this padding reserves exactly that, or it prints over the sub copy */
.intro-head{padding-bottom:44px}
.intro-head .sub{margin-bottom:0}
.herocard{position:relative;margin-top:-30px;z-index:2}
/* light placeholder — the old #0f2530 painted a near-black slab while hero.jpg loaded */
.heroph{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--sh3);background:linear-gradient(135deg,#e3eff6,var(--surface2))}
.heroph:after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;border:1px solid rgba(255,255,255,.55)}
.heroph>.imgslot{border-radius:0;box-shadow:none;margin:0;width:100%}
.herocard .imgslot.ar-hero{margin:0;width:100%;border-radius:0;box-shadow:none;aspect-ratio:16/9}
.herocard .imgslot.ph.ar-hero{border:0;box-shadow:none;background:linear-gradient(135deg,#e3eff6,var(--surface2))}
/* rotated glass pill riding the photo's top-right corner */
.scorepill{position:absolute;top:-13px;right:14px;z-index:3;transform:rotate(3deg);text-align:center;background:rgba(255,255,255,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:9px 14px;box-shadow:var(--sh2);animation:pillPop .7s var(--spring) .5s backwards}
.scorepill small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.scorepill strong{font-size:23px;font-weight:800;letter-spacing:-.02em;background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
@keyframes pillPop{0%{opacity:0;transform:rotate(3deg) scale(.5)}70%{transform:rotate(3deg) scale(1.07)}100%{opacity:1;transform:rotate(3deg) scale(1)}}
/* the three stat cards overlap the bottom edge of the photo.
   The 6px stagger below is the deliberate layer tell — so the avatar row now sits BELOW
   the label instead of above the number, where it shoved the middle card's "300+" 20px
   off the baseline the other two share and swamped the 6px offset with an accidental one. */
.trust{display:grid;grid-template-columns:1fr 1.24fr 1fr;gap:9px;margin:-28px 0 0;padding:0 6px;position:relative;z-index:3}
.trust .t{flex:1;background:var(--card);border-radius:20px;padding:12px 8px 11px;text-align:center;box-shadow:var(--sh2)}
.trust .t:nth-child(1),.trust .t:nth-child(3){transform:translateY(6px)}
.trust .t b{font-size:21px;font-weight:800;color:var(--ink);display:block;line-height:1;letter-spacing:-.02em}
.trust .t span{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:4px}
.avs{display:flex;justify-content:center;margin-top:6px}
.avs img{width:19px;height:19px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-6px;box-shadow:0 2px 5px rgba(15,37,48,.16)}
.avs img:first-child{margin-left:0}
.spacer{flex:1;min-height:14px}
/* the flexible gaps that stop a short screen trailing off into blank page — the same
   device the checkpoint uses (.mgap), applied to the option/gender/age/text screens */
.qgap{flex:1 1 auto;min-height:0}
.qgap.t{flex-grow:.6}

/* ---------- text inputs ---------- */
.bigfield{margin-top:6px}
.bigfield input{width:100%;background:var(--card);border:2px solid rgba(15,37,48,.06);border-radius:20px;padding:18px;color:var(--ink);font-size:17px;font-family:inherit;font-weight:700;box-shadow:var(--sh1);transition:border-color .2s,box-shadow .2s}
.bigfield input:focus{outline:none;border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;box-shadow:var(--sh2),var(--ring)}
.bigfield input::placeholder{color:var(--mute);font-weight:500}
.field{margin-bottom:13px}
.field label{display:block;font-size:10.5px;letter-spacing:.12em;font-weight:800;color:var(--mut);margin-bottom:8px;text-transform:uppercase}
.field input{width:100%;background:var(--card);border:2px solid rgba(15,37,48,.06);border-radius:18px;padding:16px;color:var(--ink);font-size:16px;font-weight:700;font-family:inherit;box-shadow:var(--sh1);transition:border-color .2s,box-shadow .2s} /* ≥16px: iOS won't auto-zoom on focus */
.field input:focus{outline:none;border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;box-shadow:var(--sh2),var(--ring)}
.field input::placeholder{color:var(--mute);font-weight:500}
.phonewrap{display:flex;align-items:stretch;gap:9px}
.ccode{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid rgba(15,37,48,.06);border-radius:18px;padding:0 14px;font-size:15px;font-weight:800;color:var(--ink);box-shadow:var(--sh1);white-space:nowrap}
.flag{width:23px;height:16px;border-radius:4px;object-fit:cover;box-shadow:0 0 0 1px rgba(15,37,48,.08)}
.phonewrap input{flex:1;min-width:0;background:var(--card);border:2px solid rgba(15,37,48,.06);border-radius:18px;padding:16px;color:var(--ink);font-size:16px;font-weight:700;font-family:inherit;box-shadow:var(--sh1);transition:border-color .2s,box-shadow .2s}
.phonewrap input:focus{outline:none;border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;box-shadow:var(--sh2),var(--ring)}
.phonewrap input::placeholder{color:var(--mute);font-weight:500}
/* invalid state as a class, not an inline style — an inline border-color outranked
   the :focus rule and the field could never show the gradient focus border again */
.bigfield input.err,.field input.err,.phonewrap input.err{border-color:var(--red)}
.privacy{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11.5px;font-weight:600;color:var(--mut);margin-top:14px}
.privacy svg{width:14px;height:14px;fill:var(--aq1)}

/* ---------- loader ---------- */
/* the loader's content is ~615px tall; on a 667px viewport (or any IG/FB webview) a
   centred column overflowed in BOTH directions and the block-start spill is unreachable
   (html,body are height-capped, #shell is overflow:hidden on desktop).
   auto margins centre when there is room and pin to the top when there is not. */
.loader-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-start;text-align:center}
.lstat{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;color:var(--ink)}
.lsub{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:20px}
/* NO max-width + auto margins here: an auto cross-axis margin on a flex item cancels
   align-items:stretch, so this shrank to 320px inside a 386px column and the screen ended
   up with three different left edges (22 / 67 / 95 at 430px). Everything runs the column. */
.checks{display:flex;flex-direction:column;gap:9px;text-align:left}
/* pending rows carry their state in the colour + checkbox, not in opacity —
   the old opacity:.45 dropped them to ~1.5:1 */
.chk{display:flex;align-items:flex-start;gap:12px;font-size:14px;font-weight:700;color:var(--mut);opacity:1;transition:.35s}
.chk.active,.chk.done{opacity:1;color:var(--ink)}
/* every row carries a second line: the phase's live status while it runs, then the real
   value it produced. The min-height reserves it so nothing reflows as phases turn over. */
.chk .ctx{flex:1;min-width:0}
.chk .ctx b{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
.chk .cmt{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.01em;line-height:1.22;color:var(--mute);min-height:12px;margin-top:2px;transition:color .3s}
.chk.active .cmt,.chk.done .cmt{color:var(--aq1)}
.chk.done .cmt{animation:childIn .4s var(--spring) both}
.chk .cb{width:24px;height:24px;border-radius:9px;border:2px solid rgba(15,37,48,.34);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.3s}
.chk.done .cb{background:var(--grad);border-color:transparent;box-shadow:0 6px 14px -5px rgba(8,145,178,.55)}
.chk.done .cb:after{content:"✓";color:#fff;font-weight:800;font-size:13px}
.chk.active .cb{border-color:rgba(8,145,178,.35);background:#fff}
.chk.active .cb:after{content:"";width:11px;height:11px;border:2px solid var(--aq1);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* circular ring */
.ring-wrap{position:relative;width:122px;height:122px;margin:0 auto 22px}
.ring-wrap:before{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.24),transparent 70%);animation:pulse 1.8s ease-in-out infinite}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
/* this slot used to carry three fabricated testimonials over real faces. It now rotates
   VERIFIABLE facts only — coaching since 2019, 300+ surfers, 99% satisfaction, the named
   services, Coolangatta — until the client supplies real, attributable quotes. */
.testi{margin-top:14px;background:var(--card);border-radius:20px;padding:14px;font-size:12.5px;font-weight:600;color:var(--mut);min-height:58px;display:flex;align-items:flex-start;gap:12px;box-shadow:var(--sh1);text-align:left}
.testi .tmark{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--soft);box-shadow:inset 0 0 0 1px rgba(8,145,178,.14);display:flex;align-items:center;justify-content:center}
.testi .tmark svg{width:20px;height:20px;display:block}
.tbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.tbody span{line-height:1.45}
.tbody b{color:var(--ink);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.stars{color:var(--gold);font-size:11px;letter-spacing:1.5px}
.trustline{margin-top:12px;font-size:11.5px;font-weight:600;color:var(--mut);text-align:center}
.trustline b{color:var(--ink);font-weight:800}
/* --gold (#b45309) measures 4.35:1 against the BOTTOM of the wash, which is exactly where
   the loader puts this line. --gold stays for on-card use; on the wash it is coral-deep. */
.trustline .stars{display:inline;color:var(--coral-deep)}
/* loader — richer */
.ring-wrap.big{width:150px;height:150px;margin:0 auto 16px}
.ring-wrap.big:before{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.3),transparent 68%);filter:blur(4px);animation:pulse 1.8s ease-in-out infinite}
.ring-wrap.big svg{width:150px;height:150px;position:relative}
.loader-wrap>.ring-wrap.big{margin-top:auto}
.loader-wrap>.trustline{margin-bottom:auto}
.ring-orbit{position:absolute;inset:0;animation:spin 3.2s linear infinite}
/* the 150px wrap scales the 120-unit viewBox by 1.25: the r=52/sw=9 stroke lands
   4.4–15.6px in, so the bead centre belongs at 5.5px, not at the old 122px-wrap -3px */
.ring-orbit i{position:absolute;top:5.5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--aq1);box-shadow:0 0 12px rgba(8,145,178,.9)}
.ring-orbit i:nth-child(2){top:auto;bottom:5.5px;background:var(--aq2);box-shadow:0 0 12px rgba(14,165,233,.9)}
.ldata{font-size:12px;color:var(--mut);font-weight:700;margin:-12px 0 12px}
.ldata b{color:var(--aq1);font-weight:800;font-variant-numeric:tabular-nums}
/* the six pillar meters — each one fills to the surfer's REAL pillarScores() value, and
   only at the moment the phase that owns it finishes reading it */
/* the six meters are the screen's only real data — they get the full column, not a
   320px inset strip (which drew each bar 112px wide inside a 386px card) */
.lpills{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px 16px;margin:2px 0 6px}
.lpill{display:block;text-align:left;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);transition:color .3s}
.lpill .lpr{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.lpill .lpn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpill .lpv{flex:none;font-size:11.5px;font-weight:800;letter-spacing:-.01em;text-transform:none;color:var(--mute);font-variant-numeric:tabular-nums;opacity:0;transform:translateY(3px);transition:opacity .3s,transform .4s var(--over),color .3s}
.lpill .lpv i{font-style:normal;font-size:9px;font-weight:700;color:var(--mut)}
.lpill .lpb{position:relative;display:block;height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:6px}
.lpill .lpb i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .8s var(--spring)}
.lpill.on{color:var(--ink)}
.lpill.on .lpv{opacity:1;transform:none;color:var(--aq1)}
/* a meter being read right now: a light sweeping the empty track */
.lpill.scan .lpb{box-shadow:inset 0 0 0 1px rgba(8,145,178,.22)}
.lpill.scan .lpb:after{content:"";position:absolute;top:0;bottom:0;left:0;width:42%;border-radius:99px;
  background:linear-gradient(90deg,rgba(8,145,178,0),rgba(8,145,178,.4),rgba(8,145,178,0));animation:lscan 1.05s linear infinite}
@keyframes lscan{from{transform:translateX(-110%)}to{transform:translateX(255%)}}

/* ---------- score reveal ---------- */
.reveal-wrap{text-align:center;display:flex;flex-direction:column;flex:1}
/* liquid ring — 224px circle, thick rounded gradient stroke, pulsing halo */
.gauge{position:relative;width:224px;height:224px;margin:12px auto 2px;z-index:1}
.gauge svg{position:relative;z-index:1;width:100%;height:100%;display:block}
.ghalo{position:absolute;inset:-22px;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle,rgba(14,165,233,.28),rgba(14,165,233,0) 68%);filter:blur(6px);
  animation:haloPulse 3.2s ease-in-out infinite}
@keyframes haloPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.13);opacity:.95}}
.gauge .gtrack{fill:none;stroke:#dceaf2;stroke-width:19} /* was #ffffff — invisible now the page is light */
.gauge #gf{fill:none;stroke:url(#gg);stroke-width:19;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;filter:drop-shadow(0 4px 10px rgba(8,145,178,.32))}
.bignum{position:absolute;inset:0;z-index:2;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:66px;font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--ink);
  background:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:var(--ink)}
.bignum .of{font-size:14px;font-weight:700;letter-spacing:0;margin-top:5px;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.reveal-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-top:12px}
.reveal-headline{font-size:23px;font-weight:800;line-height:1.22;letter-spacing:-.025em;margin:14px 4px 9px;color:var(--ink)}
.reveal-headline .red{color:var(--coral)}
/* the score's provenance, as two chips under the ring — the level it measured and
   how many scored answers produced it. Not decoration: both come from levelAvg(). */
.lvl-line{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:15px}
/* inline-block, not inline-flex: a flex chip turns every text node into a flex item and
   the row gap then opens a 6px hole around each <b> ("Measured on  9  technique answers") */
.lvl-line span{display:inline-block;background:var(--card);border-radius:99px;padding:7px 13px;font-size:11px;font-weight:700;line-height:1.25;color:var(--mut);box-shadow:var(--sh1);letter-spacing:-.005em}
.lvl-line b{color:var(--ink);font-weight:800}
.lvl-line .lvb{background:linear-gradient(135deg,#f0fafd,#e8f4fb);box-shadow:inset 0 0 0 1px rgba(8,145,178,.16),var(--sh1)}
.lvl-line .lvb b{color:var(--aq1)}
.lvl-line .lvb em{font-style:normal;color:var(--aq1);font-weight:800}

/* ---------- the diagnostic instrument: radar + the six values in ONE card ----------
   Six free-floating cards used to compete with the radar for the same reading; now the
   shape and the numbers are the same artefact, and the limiter is the one coral cell. */
.radarcard{background:var(--card);border-radius:26px;padding:15px 15px 15px;margin:16px 0 0;text-align:left;
  box-shadow:var(--sh2),0 9px 0 -4px rgba(255,255,255,.94),0 18px 32px -18px rgba(15,37,48,.32)}
.radarcard .dgh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.radarcard .dgt{font-size:13.5px;font-weight:800;letter-spacing:-.015em;color:var(--ink)}
.radarcard .dgs{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--aq1);white-space:nowrap}
/* the 300×212 viewBox stretches to whatever width it is given: cap it so a 430px phone
   gets a centred instrument instead of a hexagon with its labels flung to the margins */
.radarcard>svg{display:block;width:100%;max-width:330px;margin:0 auto}
.radarcard .rlab{font:700 10px 'Plus Jakarta Sans',sans-serif;fill:var(--mut)}
/* the instrument and its read-out are the same artefact: they share ONE edge. The svg is
   capped at 330px, so the numbers under it are too — otherwise the radar sat 13px inset
   from the values it belongs to at 430px (and aligned only by accident at 375). */
/* minmax(0,1fr), NOT 1fr: `1fr` is minmax(AUTO,1fr), so the third column's min-content
   ("Mindset"+the Limiter flag, "Equipment") ate the free space and the tracks came out
   96.8/79.0/127.1px. The bars are % of their own cell, so four pillars all reading 2.0/4
   drew fills of 53/37/29/53px — the one instrument on the screen was encoding column
   width, not score. Equal tracks make bar length mean the number again. */
.pillrows{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:6px auto 0;max-width:330px;padding-top:12px;border-top:1px solid var(--line2);text-align:left}
@media(min-width:392px){.pillrows{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prow2{position:relative;display:block;margin:0;background:var(--surface2);border-radius:15px;padding:9px 11px 10px;box-shadow:none;font-size:12px;font-weight:700;color:var(--ink)}
/* the flag gets its own line under the name (flex-basis 100% on .nm2 forces the wrap):
   sharing a 101px track with "Mindset" ellipsised both, and it was the limiter cell's
   min-content that unbalanced the grid in the first place */
.prow2 .p2h{display:flex;align-items:center;gap:0 6px;min-width:0;flex-wrap:wrap}
.prow2 .nm2{flex:1 1 100%;min-width:0;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .vv{display:block;font-size:17px;font-weight:800;letter-spacing:-.025em;color:var(--ink);margin-top:3px;line-height:1;font-variant-numeric:tabular-nums}
.prow2 .vv i{font-style:normal;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:0}
.prow2 .bar2{display:block;flex:none;height:5px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:8px}
.prow2 .bar2 i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width 1.1s var(--spring)}
.prow2.top .vv{background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.prow2.weak{background:var(--coral-bg);box-shadow:inset 0 0 0 1px var(--coral-line)}
.prow2.weak .vv{color:var(--coral-deep)}
.prow2.weak .bar2{background:var(--track-warn)}
.prow2.weak .bar2 i{background:linear-gradient(135deg,#f97316,#ea580c)}
/* defensive: a pillar the diagnostic never got to read (same treatment as the checkpoint) */
.prow2.wait .nm2,.prow2.wait .vv{color:var(--mute)}
.prow2.wait .bar2{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(15,37,48,.10)}
/* the flag now sits INSIDE the row (the old absolute chip collided with the row above it) */
.prow2 .pflag{flex:none;margin-top:5px;background:linear-gradient(135deg,#d1490b,#a8380c);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;border-radius:99px;padding:3px 7px;line-height:1.25;box-shadow:0 6px 14px -6px rgba(234,88,12,.6)}

/* ---------- the insight: your #1 limiter ---------- */
.limbox{position:relative;overflow:hidden;background:var(--coral-bg);border:1px solid var(--coral-line);border-radius:24px;padding:15px 16px 16px;margin:14px 0 0;text-align:left;
  box-shadow:var(--sh2),0 20px 36px -18px rgba(234,88,12,.45)}
.limbox:before{content:"";position:absolute;top:-56px;right:-42px;width:158px;height:158px;border-radius:50%;background:radial-gradient(circle,rgba(234,88,12,.16),transparent 70%);pointer-events:none}
.limbox .lhead{position:relative;display:flex;align-items:center;gap:12px}
.limbox .li{flex:0 0 46px;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ea580c);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.32),0 16px 32px -12px rgba(234,88,12,.8)}
.limbox .li svg{width:22px;height:22px;fill:#fff;display:block}
.limbox .lt{flex:1;min-width:0}
.limbox .lk{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-ink);font-weight:800;line-height:1.2}
.limbox .ln2{display:block;font-size:20px;font-weight:800;letter-spacing:-.028em;color:var(--ink);margin-top:3px;line-height:1.1}
.limbox .lv{flex:none;text-align:right;font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1;color:var(--coral-deep);font-variant-numeric:tabular-nums}
.limbox .lv i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--coral-ink);letter-spacing:0}
.limbox p{position:relative;font-size:12.5px;font-weight:600;color:var(--coral-ink);line-height:1.5;margin-top:8px}
.limbox p b{color:var(--ink);font-weight:800}
/* the "why it is the limiter" line — the actual comparison, so the flag reads as a finding */
.limbox .lwhy{font-size:11.5px;font-weight:700;color:var(--coral-ink);margin-top:12px;padding-top:11px;border-top:1px solid var(--coral-line)}
.limbox .lwhy b{color:var(--coral-deep);font-weight:800}

/* ---------- emotional proof: the stuck photo, bound to the loss line ---------- */
.stuck{position:relative;border-radius:26px;overflow:hidden;background:var(--card);margin:14px 0 0;text-align:left;box-shadow:var(--sh2)}
.stuck .sph{position:relative;line-height:0}
.stuck .sph .imgslot{width:100%;display:block;border-radius:0;box-shadow:none;aspect-ratio:16/10;object-fit:cover;filter:saturate(.82) contrast(1.02)}
.stuck .sph .imgslot.ph{aspect-ratio:16/10;height:auto}
.stuck .sph:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(9,38,50,.38),rgba(9,38,50,0) 48%,rgba(9,38,50,.20))}
.stuck .schip{position:absolute;z-index:2;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border-radius:99px;padding:6px 11px;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--coral-ink);box-shadow:0 10px 22px -10px rgba(15,37,48,.6)}
.stuck .schip:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--coral)}
.stuck .sbody{background:var(--coral-bg);border-top:1px solid var(--coral-line);padding:14px 16px 15px}
.stuck .sk{display:block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-ink);margin-bottom:6px}
.stuck p{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--coral-ink)}
.stuck p b{color:var(--coral-deep);font-weight:800}

/* ---------- projection: the fork ----------
   Two futures, deliberately unequal. Path A is flat, dull and small; Path B is the
   barrel photo over a deep aqua field. The numbers carry the screen. */
.fork{display:flex;flex-direction:column;gap:0;margin:14px 0 0;text-align:left}
.fpath{position:relative;border-radius:24px;overflow:hidden}
.fpath .fk{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.fpath .fk:before{content:"";flex:none;width:8px;height:8px;border-radius:50%}
.fpath .fnum{font-weight:800;line-height:1;letter-spacing:-.045em;margin:9px 0 6px}
.fpath .fl{font-size:12.5px;font-weight:600;line-height:1.45}
/* path A — the default future: flat line, muted card, no elevation */
.fpath.bad{background:var(--coral-bg);border:1px solid var(--coral-line);padding:14px 16px 14px;box-shadow:0 1px 2px rgba(154,52,21,.05)}
.fpath.bad .fk{color:var(--coral-ink)}
.fpath.bad .fk:before{background:var(--coral)}
.fpath.bad .fnum{font-size:33px;color:var(--coral)}
.fpath.bad .fl{color:var(--coral-ink)}
.fpath.bad .fl b{color:var(--coral-deep);font-weight:800}
.fflat{display:block;height:3px;border-radius:99px;margin-top:12px;opacity:.5;
  background:repeating-linear-gradient(90deg,var(--coral) 0 9px,transparent 9px 17px)}
/* the hinge of the whole fork, and it sits on the page wash with no card behind it:
   --mute (#5f7987) measured 4.23:1 at the top of the gradient and 3.98:1 lower down.
   --mut is 5.48:1 on the wash, and 10.5px keeps it under the 18.66px bold exemption safely. */
.forkor{display:flex;align-items:center;gap:11px;margin:11px 2px;font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.forkor:before,.forkor:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(15,37,48,.16),transparent)}
/* path B — the other path, and the barrel photo IS the card */
.fpath.good{background:var(--card);box-shadow:var(--sh3),var(--ring)}
.fpath.good .fph{position:relative;line-height:0}
.fpath.good .fph .imgslot{width:100%;display:block;border-radius:0;box-shadow:none;aspect-ratio:16/10;object-fit:cover}
.fpath.good .fph .imgslot.ph{aspect-ratio:16/10;height:auto}
.fpath.good .fph:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,32,44,.34),rgba(4,32,44,0) 46%,rgba(4,32,44,.34))}
.fpath.good .fchip{position:absolute;z-index:2;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border-radius:99px;padding:6px 11px;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--aq1);box-shadow:0 10px 22px -10px rgba(15,37,48,.6)}
.fpath.good .fchip:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--aq2)}
/* the same deep aqua field the scratch prize uses — the funnel's "payoff" surface.
   The top light is cut to .12 (from .20) for the same reason it is on the prize: at .20 the
   band the kicker sits in lifted to ~rgb(17,121,154), where no legible aqua-white clears
   4.5:1 at 9.5px. It now composites to ~rgb(14,117,148) and #e8f8ff measures 4.9:1. */
.fpath.good .ffoot{position:relative;padding:15px 16px 16px;
  background:radial-gradient(120% 90% at 50% -20%,rgba(56,189,248,.12),rgba(56,189,248,0) 60%),linear-gradient(160deg,#0b6f8c 0%,#0a5270 46%,#07364b 100%)}
.fpath.good .fk{color:#e8f8ff}
.fpath.good .fk:before{background:#7dd3fc}
.fpath.good .fnum{font-size:41px;color:#fff;background:linear-gradient(178deg,#ffffff 0%,#e6f7ff 48%,#b6e2f8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.fpath.good .fl{color:#c4e3f1}
.fpath.good .fl b{color:#fff;font-weight:800}

/* the chart is an ILLUSTRATION of the two paths — it is labelled as one */
.chartbox2{background:var(--card);border-radius:24px;padding:13px 12px 12px;margin:14px 0 0;box-shadow:var(--sh1);text-align:left}
.chartbox2 .cbh{margin:0 2px 2px}
.chartbox2 .cbt{font-size:12.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.chartbox2 .cfree{fill:var(--mut);font:700 10px 'Plus Jakarta Sans',sans-serif}
.chartbox2 .caxis{fill:var(--mute);font:600 9.5px 'Plus Jakarta Sans',sans-serif}
.cbnote{font-size:10px;font-weight:600;color:var(--mute);line-height:1.4;margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.legend{display:flex;justify-content:center;gap:18px;margin-top:2px;font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.savedpill{display:block;background:linear-gradient(135deg,#f0fafd,#e8f4fb);border:1px solid rgba(8,145,178,.16);border-radius:20px;padding:14px 16px;font-size:13.5px;color:var(--ink);font-weight:700;margin:14px 0 0;text-align:center;line-height:1.45;box-shadow:var(--sh1)}
.savedpill b{background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-weight:800}

/* ---------- commercial chrome ---------- */
.disc-badge{display:inline-flex;align-items:center;gap:6px;background:#e9f7fc;border:1px solid rgba(8,145,178,.28);color:var(--aq1);font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:99px;margin-top:10px;position:relative}
.scarce{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:800;color:var(--coral-ink);margin:2px 0 12px}
.scarce .dotr{width:8px;height:8px;border-radius:50%;background:#f97316;box-shadow:0 0 0 4px rgba(234,88,12,.14);animation:pulse 1.6s infinite;flex-shrink:0}
.guar{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;font-weight:600;color:var(--mut);margin-top:14px}
.guar svg{width:15px;height:15px;fill:var(--aq1);flex-shrink:0}

/* ---------- plans / payment — vertical accordion ---------- */
/* every plan visible at once, cheapest first; the body collapses so the list stays
   scannable and the 12 verbatim inclusions only unfold for the plan being considered */
.plans{display:flex;flex-direction:column;gap:12px;margin:18px 0 2px}
.plan{
  position:relative;width:100%;display:block;text-align:left;
  background:var(--card);border:2px solid rgba(15,37,48,.06);border-radius:22px;
  padding:18px 18px 16px;cursor:pointer;box-shadow:var(--sh1);
  transition:box-shadow .3s,border-color .3s,transform .2s var(--spring);
}
.plan:before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;background:radial-gradient(140% 70% at 50% -20%,rgba(14,165,233,.09),transparent 60%)}
.plan:hover{box-shadow:var(--sh2)}
.plan:active{transform:scale(.99)}
.plan.sel{
  border-color:transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;
  box-shadow:var(--sh2),var(--ring);
}
.plan .psel{position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.3);box-shadow:0 8px 18px -6px rgba(8,145,178,.55);transition:opacity .25s,transform .4s var(--over)}
.plan .psel:after{content:"";width:10px;height:5.5px;border:2.4px solid #fff;border-top:0;border-right:0;border-radius:1px;transform:rotate(-45deg) translate(1px,-1px)}
.plan.sel .psel{opacity:1;transform:scale(1)}
/* header — always visible */
.plan .pname{position:relative;display:block;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);line-height:1.3;padding-right:34px}
.plan .pold{display:block;font-size:11px;font-weight:700;color:var(--mute);text-decoration:line-through;margin:8px 0 -4px}
.plan .pprice{position:relative;display:flex;align-items:baseline;margin-top:8px;font-size:36px;font-weight:800;line-height:1;letter-spacing:-.045em;color:var(--ink)}
.plan .pprice i{font-style:normal;font-size:15px;font-weight:800;letter-spacing:0;margin-right:3px;transform:translateY(-10px);color:var(--aq1)}
.plan .pprice em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:0;margin-left:4px;color:var(--mut)}
.plan .psess{position:relative;display:flex;align-items:flex-start;gap:8px;width:100%;margin-top:9px;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.35}
.plan .psess svg{flex:0 0 17px;width:17px;height:17px;margin-top:1px}
/* collapsible body */
.plan .pbody{position:relative;display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--spring)}
.plan.open .pbody{grid-template-rows:1fr}
.plan .pbody>div{overflow:hidden;min-height:0}
.plan .pfeat{display:flex;flex-direction:column;gap:9px;padding-top:14px;margin-top:13px;border-top:1px solid rgba(15,37,48,.08)}
.plan .pfeat span{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;font-weight:600;line-height:1.45;color:var(--ink)}
/* signature #8 on the commercial screens: a drawn check in a soft filled circle,
   not a font glyph whose optical weight changes per platform (see TICK_SVG in the JS) */
.plan .pfeat span svg{flex:0 0 15px;width:15px;height:15px;margin-top:2px}
.plan .ptoggle{position:relative;display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;font-weight:800;color:var(--aq1);letter-spacing:.01em}
.plan .ptoggle svg{width:14px;height:14px;transition:transform .35s var(--spring)}
.plan.open .ptoggle svg{transform:rotate(180deg)}
.plan .pbadge{position:absolute;top:-11px;left:18px;background:var(--grad-ink);color:#fff;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:99px;white-space:nowrap;box-shadow:0 8px 18px -4px rgba(8,145,178,.55);z-index:2}
.disc-banner{text-align:center;margin:0 0 12px}
.paytrust{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:600;color:var(--mut);margin-top:12px}

/* ---------- sticky frosted checkout bar (plans screen only) ---------- */
.step.padbar{padding-bottom:148px}   /* bar is 114px at 375, 134px at 320 (trust line wraps) */
.ctabar{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;z-index:50;
  width:min(460px,100%);
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);
  border-top:1px solid rgba(255,255,255,.9);
  border-radius:26px 26px 0 0;
  box-shadow:0 -12px 40px -8px rgba(15,37,48,.18);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(118%);visibility:hidden;
  transition:transform .55s var(--spring),visibility 0s .55s;
}
body.has-bar .ctabar{transform:none;visibility:visible;transition-delay:0s}
@media(min-width:768px){.ctabar{bottom:18px;border-radius:26px;width:min(436px,calc(100% - 24px));border:1px solid rgba(255,255,255,.9)}}
.ctabar .cta{margin-top:0;white-space:nowrap}   /* a label regression must show, not silently wrap */
.ctabar .paytrust{margin-top:9px;flex-wrap:wrap}
.ctabar .paytrust #payname{color:var(--ink);font-weight:800}

/* ---------- scratch ---------- */
/* the in-page scratch card is gone — the card lives in the modal now (.m-scratch et al). */
/* above .modal-ov (z-index 100) — the reveal burst used to paint *under* the scrim's
   blur, so the one moment of reward in the paywall rendered as nothing */
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:120;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

/* ---------- coach's note — chat row: avatar + name label + bubble ----------
   The note alone measured 211px on a 758px column and the single trailing spacer dumped
   the whole remainder below it (438px of void at 430x900). It now gets the funnel's
   strongest authority image above it and the .mgap split the checkpoint uses. */
.snipshot{margin:0 0 14px}
.snip{position:relative;display:flex;align-items:flex-start;gap:11px;background:none;box-shadow:none;padding:0;border-radius:0;text-align:left;margin-top:4px}
.snip .sav{position:relative;width:44px;height:44px;flex:0 0 44px;border-radius:50%;overflow:visible;background:var(--grad-ink);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;box-shadow:0 8px 18px -6px rgba(8,145,178,.5)}
.snip .sav:after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--green);border:2.5px solid #fff;z-index:2}
.snip .sav img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;display:block}
.snip .sk{flex:1;min-width:0;display:block;margin:0}
.snip .skk{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:800;margin:2px 0 7px}
/* typing row and note share one grid cell, so the bubble's box never snaps from 34px
   to full height — the message cross-fades in place (glasswater.html:274-278) */
.snip .sbub{position:relative;background:var(--card);border-radius:4px 26px 26px 26px;box-shadow:var(--sh2);padding:16px 17px;display:grid}
.snip .sbub>*{grid-area:1/1}
.snip .skn{font-size:11px;color:var(--mut);font-weight:600;margin-top:8px;letter-spacing:.02em} /* sits on the page wash, not a card — needs --mut */
.snip .st{font-size:16px;font-weight:800;line-height:1.35;letter-spacing:-.02em;color:var(--ink);margin-bottom:9px}
.snip .sb{font-size:13.5px;line-height:1.55;font-weight:500;color:var(--mut)}
.snip .sb b{color:var(--ink);font-weight:700}
.snip .typing{min-height:34px;align-items:center;padding:0}
.snipstat{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#f0fafd,#e8f4fb);border:1px solid rgba(8,145,178,.14);border-radius:16px;padding:11px 14px;margin-top:14px;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left}
.snipstat b{font-size:19px;font-weight:800;letter-spacing:-.03em;flex-shrink:0;background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

/* ---------- milestone (rich checkpoint) ----------
   The checkpoint is a READ-OUT, not a receipt: it prints the level it has measured so far,
   the pillars it can already score, a named 4-section rail, and what the next block opens.
   Every number on it comes from levelAvg()/pillarScores() — nothing is decorative. */
/* every other screen starts at the top of #app; centring this one left the block floating
   in the middle with dead space above and below, reading as misaligned against the rest */
.mile{flex:1;display:flex;flex-direction:column;justify-content:flex-start;text-align:center}
/* the three flexible gaps absorb the slack: a tall phone gets airier spacing between the
   blocks instead of one dead pool above the CTA */
.mgap{flex:1 1 auto;min-height:7px}
.mile>.mhead{animation:childIn .62s var(--spring) backwards}
.mile>.mread{animation:childIn .62s var(--spring) .10s backwards}
.mile>.mnext{animation:childIn .62s var(--spring) .19s backwards}
.mile-ck{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--aq1);font-weight:800;text-align:center;margin-bottom:6px}
.mile .mck{width:52px;height:52px;border-radius:50%;background:var(--grad);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 18px 40px -14px rgba(8,145,178,.6);animation:pop .5s var(--over) both}
.mile .mck svg{width:25px;height:25px;fill:#fff}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.mile h1{font-size:22px;line-height:1.13;margin:2px 0 6px}
.mile .sub{font-size:12.5px;line-height:1.45;margin-bottom:0}

/* the read-out card — layered: a second sheet peeks out under the bottom edge */
.mread{position:relative;background:var(--card);border-radius:24px;padding:13px 15px 12px;text-align:left;
  box-shadow:var(--sh2),0 9px 0 -4px rgba(255,255,255,.94),0 18px 32px -18px rgba(15,37,48,.32)}
/* level read-out */
.mtop{display:flex;align-items:center;gap:12px}
.mtop .mlb{flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:var(--soft);box-shadow:inset 0 0 0 1px rgba(8,145,178,.16);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--aq1)}
.mtop .mlt{flex:1;min-width:0}
.mtop .mlk{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .mlv{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-top:2px;line-height:1.2}
.mtop .mlv em{font-style:normal;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:0}
/* section rail — the real progress artefact: four named segments, one live */
.msec{margin-top:11px;padding-top:10px;border-top:1px solid var(--line2)}
.mseck{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:10.5px;font-weight:700;color:var(--mut);margin-bottom:7px}
.mseck b{color:var(--ink);font-weight:800}
.mseck .msq{color:var(--aq1);font-weight:800;white-space:nowrap}
.msegs{display:flex;gap:6px}
.msegs i{flex:1;height:8px;border-radius:99px;background:var(--track);position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,37,48,.07)}
.msegs i.ok{background:var(--grad);box-shadow:0 6px 14px -8px rgba(8,145,178,.75)}
.msegs i.now:after{content:"";position:absolute;left:0;top:0;bottom:0;width:44%;background:var(--grad);border-radius:99px;animation:segp 1.8s ease-in-out infinite}
@keyframes segp{0%,100%{width:34%;opacity:.55}50%{width:62%;opacity:1}}
.msl{display:flex;gap:6px;margin-top:6px}
.msl span{flex:1;min-width:0;font-size:9px;line-height:1.2;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msl span.ok{color:var(--aq1)}
.msl span.now{color:var(--ink)}
/* the six pillars, as far as they can be scored right now */
.mpg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line2)}
.mpc .mpr{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.mpc .mpn{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpc .mpv{flex:none;font-size:12.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.mpc .mpv i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--mut);letter-spacing:0}
.mpc .mpb{display:block;height:5px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:5px}
.mpc .mpb i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .95s var(--spring)}
.mpc.top .mpv{background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
/* coral is the limiter language everywhere else in the funnel — same meaning here */
.mpc.low .mpv{color:var(--coral-ink);-webkit-text-fill-color:var(--coral-ink)}
.mpc.low .mpb{background:var(--track-warn)}
.mpc.low .mpb i{background:linear-gradient(135deg,#f97316,#ea580c)}
.mpc.wait .mpn,.mpc.wait .mpv{color:var(--mute)}
.mpc.wait .mpb{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(15,37,48,.10)}
.mnote{font-size:11px;font-weight:600;color:var(--mut);line-height:1.4;margin-top:9px;padding-top:8px;border-top:1px solid var(--line2)}
.mnote b{color:var(--ink);font-weight:800}
/* what the next block opens — the pull-forward */
.mnext{display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(135deg,#f0fafd,#e8f4fb);border:1px solid rgba(8,145,178,.16);border-radius:22px;padding:11px 14px;box-shadow:var(--sh1)}
.mnext .mni{flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(8,145,178,.14),0 8px 18px -10px rgba(8,145,178,.75)}
.mnext .mni svg{width:20px;height:20px;fill:none;stroke:var(--aq1);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.mnext .mnb{flex:1;min-width:0}
.mnext .mnk{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--aq1);font-weight:800}
.mnext .mnt{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-top:2px;line-height:1.22}
.mnext .mnc{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.mnext .mnc span{background:rgba(255,255,255,.86);border-radius:99px;padding:3px 9px;font-size:10.5px;font-weight:700;color:var(--mut);box-shadow:0 1px 2px rgba(15,37,48,.06)}

/* ---------- number inputs + board card ---------- */
.numrow{display:flex;gap:11px;margin-top:4px}
.numrow .field{flex:1;margin-bottom:0}
.numfield{position:relative}
.numfield .ni{position:absolute;left:15px;top:37px;font-size:17px;pointer-events:none;opacity:.9;z-index:1}
.numfield input{padding-left:44px!important}
.skiplink{display:flex;align-items:center;justify-content:center;min-height:44px;padding:12px;text-align:center;margin-top:8px;font-size:13px;line-height:20px;font-weight:600;color:var(--mut);text-decoration:underline;text-underline-offset:3px;cursor:pointer} /* 44px tap target */
.boardcard{position:relative;overflow:hidden;background:linear-gradient(160deg,#f2fbfe,#e9f3fa);border:1px solid rgba(8,145,178,.14);border-radius:22px;padding:17px 18px;margin:18px 0 4px;color:var(--ink);box-shadow:var(--sh2)}
.boardcard:before{content:"";position:absolute;top:-46px;right:-32px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(14,165,233,.18),transparent 70%);pointer-events:none}
.boardcard .bk{position:relative;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--aq1);font-weight:800;display:flex;align-items:center;gap:7px}
.boardcard .bv{position:relative;font-size:31px;font-weight:800;line-height:1;letter-spacing:-.04em;margin:9px 0 3px;background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.boardcard .bv small{font-size:14px;font-weight:700;-webkit-text-fill-color:var(--mut);color:var(--mut)}
/* the "why" line — the actual sum, so the litres read as a calculation, not a guess.
   --aq1 (#0e7490) on the #f2fbfe card is 5.3:1, so 11px is safely AA. */
.boardcard .bw{position:relative;font-size:11px;font-weight:700;color:var(--aq1);line-height:1.45;margin:0 0 7px}
.boardcard .bd{position:relative;font-size:12.5px;font-weight:600;color:var(--mut);line-height:1.5}
.boardcard .bd b{color:var(--ink);font-weight:800}
.boardcard.empty{background:var(--card);border:1.5px dashed rgba(15,37,48,.12);color:var(--mut);box-shadow:var(--sh1)}
.boardcard.empty:before{display:none}
.boardcard.empty .bk{color:var(--mut)}

/* ---------- tap feedback ---------- */
.opt,.gcard,.acard{position:relative;overflow:hidden}
.ripple{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(14,165,233,.3);transform:translate(-50%,-50%) scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:translate(-50%,-50%) scale(18);opacity:0}}
.floatup{position:fixed;z-index:80;font-size:21px;transform:translate(-50%,-50%);animation:flup .8s var(--spring) forwards;pointer-events:none}
@keyframes flup{20%{opacity:1}to{transform:translate(-50%,-190%) scale(1.3);opacity:0}}
.opt.sel,.gcard.sel,.acard.sel{animation:selPop .38s var(--over)}
@keyframes selPop{0%,100%{transform:translateY(-3px)}40%{transform:translateY(-3px) scale(1.03)}}
.opt.sel .tick,.opt.sel .box{animation:ckPop .4s var(--over)}
@keyframes ckPop{from{transform:scale(.3)}to{transform:scale(1)}}

/* progress rail — the shimmer sweep and the 🏄 emoji are gone with the dot rail.
   #barsurfer stays in the DOM (setProgress writes to it) but never paints. */
.bar{position:relative;overflow:visible}
.bar>i{position:relative;overflow:hidden}
#barsurfer{display:none}

/* coach's note typing indicator */
.typing{display:flex;gap:5px;padding:8px 2px 4px}
.typing i{width:8px;height:8px;border-radius:50%;background:#b6cdd9;animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
/* both properties are keyframed — animating opacity 1→1→1 left only a bare bob */
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.snipin{animation:childIn .5s var(--spring) both}

/* score reveal fx */
.radarg{transform-box:view-box;transform-origin:50% 49%;animation:radarIn .9s .3s var(--over) backwards}
@keyframes radarIn{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}
.rdot{transform-box:fill-box;transform-origin:center;animation:dotIn .4s var(--over) backwards}
@keyframes dotIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.bignum.settled{animation:numSettle .5s var(--over)}
@keyframes numSettle{35%{transform:scale(1.14)}}
.limbox.attn{animation:attn 1.1s}
@keyframes attn{35%{box-shadow:0 0 0 8px rgba(234,88,12,.14)}70%,100%{box-shadow:0 0 0 0 rgba(234,88,12,0)}}
.gauge .bub{position:absolute;bottom:2px;z-index:0;width:8px;height:8px;border-radius:50%;background:rgba(14,165,233,.22);animation:rise 3.6s ease-in infinite}
.gauge .bub:nth-child(odd){width:5px;height:5px}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.8}100%{transform:translateY(-186px);opacity:0}}

/* CTA shine sweep */
.cta{position:relative;overflow:hidden}
.cta:after{content:"";position:absolute;top:0;left:0;width:55%;height:100%;background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.35) 50%,transparent 80%);transform:translateX(-170%) skewX(-18deg);animation:ctashine 3.4s ease-in-out infinite}
@keyframes ctashine{0%,55%{transform:translateX(-170%) skewX(-18deg)}90%,100%{transform:translateX(330%) skewX(-18deg)}}
.cta:disabled:after,.cta.green:after{display:none}

/* milestone radiating rings */
.mck{position:relative}
.mck:before,.mck:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(14,165,233,.45);animation:ringx 1.6s ease-out .35s infinite}
.mck:after{animation-delay:.95s}
@keyframes ringx{from{transform:scale(1);opacity:.8}to{transform:scale(1.95);opacity:0}}

/* loader + result juice */
.testi.tin{animation:childIn .5s var(--spring) both}
.chk.done .cb{animation:pop .35s var(--over)}
.plan .pbadge{animation:badgeP 2s infinite}
/* NO translateX(-50%): the badge was centred with left:50% once, but .plan .pbadge is
   positioned with left:18px now. Both keyframes carried the translate, so it was permanent
   — the 108px "★ Your match" pill sat at x=-12, hanging off the left edge of its own card
   (and getting sliced by #shell's overflow-x:clip on desktop). */
@keyframes badgeP{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
/* hintB is bound on .m-hint (the modal's scratch cue) */
@keyframes hintB{50%{transform:translateY(3px)}}

/* ---------- SVG re-tint (markup is built in JS — restyled here) ---------- */
.radarcard svg polygon{stroke:#dfeaf1}
.radarcard svg line{stroke:#e4eef4}
.radarcard .radarg polygon{fill:rgba(8,145,178,.16);stroke:var(--aq1)}
.radarcard .rdot{fill:var(--aq1);stroke:#fff}
.chartbox2 svg line{stroke:#e4eef4}
.chartbox2 #pfree{stroke:#a8c0cd}
.chartbox2 #pred{stroke:var(--coral)}
.chartbox2 #dred{fill:var(--coral);stroke:#fff}
.chartbox2 #pgreen{stroke:var(--aq1)}
.chartbox2 #dgreen{fill:var(--aq1);stroke:#fff}
.chartbox2 #gArea stop:first-child{stop-color:#0ea5e9;stop-opacity:.28}
.chartbox2 #gArea stop:last-child{stop-color:#0ea5e9;stop-opacity:0}
.legend span:nth-child(1) i{background:var(--coral)!important}
.legend span:nth-child(2) i{background:var(--aq1)!important}
/* both rings encode a value, so every stop stays ≥3:1 against the light page */
.gauge #gg stop:first-child{stop-color:#0891b2}
.gauge #gg stop:last-child{stop-color:#0284c7}
.ring-wrap.big svg circle{stroke:#dfeef5}
.ring-wrap.big svg #ringfill{stroke:url(#rg)}
.ring-wrap.big #rg stop:nth-child(1){stop-color:#0e7490}
.ring-wrap.big #rg stop:nth-child(2){stop-color:#0891b2}
.ring-wrap.big #rg stop:nth-child(3){stop-color:#0284c7}

/* ---------- reduced motion ---------- */
/* delays must go too: several entrances use `backwards`/`both` fill, so a surviving
   delay = flash-of-invisible-content (radar dots held 1.35s, .step>* held .40s). */
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .snip .typing{display:none}   /* nothing to watch — the note is revealed immediately */
}

/* ---------- scratch modal ---------- */
.modal-ov{position:fixed;inset:0;z-index:100;background:rgba(9,38,50,.4);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px) saturate(1.1);display:flex;align-items:center;justify-content:center;padding:22px;animation:ovin .3s ease}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.modal-card{width:100%;max-width:360px;background:var(--card);border-radius:30px;padding:26px 22px 26px;text-align:center;box-shadow:var(--sh3);position:relative;animation:modin .45s var(--over)}
/* the card is a tabindex="-1" landing spot for screen readers, not a control — it must
   not paint the global focus ring. The ring belongs on ×, the mute toggle and the CTA. */
.modal-card:focus,.modal-card:focus-visible{outline:none;box-shadow:var(--sh3)}
@keyframes modin{from{opacity:0;transform:translateY(26px) scale(.92)}to{opacity:1;transform:none}}
/* the two 36px corner buttons live in this row — reserve their width or the kicker
   runs underneath them on a 320px phone */
.modal-kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--aq1);font-weight:800;padding:0 40px;line-height:1.35;min-height:36px;display:flex;align-items:center;justify-content:center}
.modal-h{font-size:23px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:9px 0 5px}
.modal-sub{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:18px;line-height:1.45}
/* the stage — a real card edge (inner hairline + layered shadow), so the foil reads as
   something physically laid ON the prize instead of a flat grey rectangle */
.m-scratch{position:relative;width:100%;aspect-ratio:16/10;border-radius:20px;overflow:hidden;isolation:isolate;
  box-shadow:var(--sh2)}
/* the edge light has to be an OVERLAY, not an inset shadow: an inset shadow paints with the
   element's own background layer, which is under every positioned child — .m-prize (z1) and
   the canvas (z2) cover the padding box exactly, so it never rendered. z-index 4 puts it over
   the shimmer (z3) too, and it survives the canvas being removed on reveal. */
.m-scratch:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.30)}
.m-scratch:focus-visible{outline:3px solid var(--aq1);outline-offset:3px;border-radius:20px;box-shadow:var(--sh2),0 0 0 7px rgba(14,165,233,.18)}

/* the prize — a deep aqua→ink field, not a flat radial: a cool top light, a blue floor
   bounce and a diagonal body ramp, so the number sits in a lit space.
   The top light is pulled up out of the frame (50% -12%) and cut to .22: at .40 from
   50% 4% it lifted the band where the kicker sits to rgb(33,122,159), on which NO gold —
   and not even pure white (4.85:1) — clears 4.5:1. That band is now ~rgb(22,104,136). */
.m-prize{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:
    radial-gradient(115% 85% at 50% -12%,rgba(56,189,248,.22),rgba(56,189,248,0) 58%),
    radial-gradient(95% 75% at 50% 120%,rgba(2,132,199,.34),rgba(2,132,199,0) 62%),
    linear-gradient(162deg,#0b6f8c 0%,#0a5270 40%,#072b3d 76%,#05202e 100%)}
/* the radial bloom behind the headline number — dimmed so it lights the NUMBER, not the
   kicker line above it (the number is 38px+ bold: it only owes 3:1) */
.m-prize:before{content:"";position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px 0 0 -125px;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(125,211,252,.20),rgba(125,211,252,.07) 42%,rgba(125,211,252,0) 68%)}
/* one-shot shine sweep — armed only once the foil is off. It is deliberately BRIGHTER and
   wider than the foil's idle shimmer: the payoff must out-sparkle the thing being destroyed. */
.m-prize:after{content:"";position:absolute;top:-40%;left:0;width:46%;height:180%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 14%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 86%);
  transform:translateX(-200%) skewX(-16deg);opacity:0}
.m-prize.revealed:after{opacity:1;animation:prizeSweep 1.05s .14s var(--spring) forwards}
@keyframes prizeSweep{from{transform:translateX(-200%) skewX(-16deg)}to{transform:translateX(330%) skewX(-16deg)}}
.m-prize.revealed:before{animation:prizeGlow 1.5s ease-out}
@keyframes prizeGlow{0%{opacity:.3;transform:scale(.68)}38%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
/* the reveal gets a moment: the whole prize block settles in on --over */
.m-prize .pwrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:0 14px;text-align:center}
.m-prize.revealed .pwrap{animation:prizeIn .62s var(--over) both}
@keyframes prizeIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
/* warm gold kicker, flanked by two fading hairlines. No text-shadow: a warm 10px blur under
   a 9.5px glyph only softens its edges — it costs legibility instead of buying glow. */
.m-prize .pk{display:flex;align-items:center;gap:9px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-on-dark);font-weight:800}
.m-prize .pk:before,.m-prize .pk:after{content:"";width:17px;height:1px;flex:none;background:linear-gradient(90deg,rgba(255,223,161,0),rgba(255,223,161,.85))}
.m-prize .pk:after{background:linear-gradient(90deg,rgba(255,223,161,.85),rgba(255,223,161,0))}
/* THE element — pushed as large as the stage allows, tracking pulled tight */
.m-prize .pt{font-size:clamp(38px,13.5vw,52px);font-weight:800;line-height:.96;letter-spacing:-.055em;margin:9px 0 8px;
  color:#fff;background:linear-gradient(178deg,#ffffff 0%,#eaf8ff 46%,#a9dcf6 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.m-prize .ps{font-size:11.5px;font-weight:600;color:#bfdfee;line-height:1.4;max-width:236px}

#mScratchCanvas{position:absolute;inset:0;z-index:2;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
/* slow shimmer travelling over the untouched foil — pure CSS, killed on reveal */
.m-foilshine{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.m-foilshine:after{content:"";position:absolute;top:-40%;left:0;width:38%;height:180%;
  background:linear-gradient(100deg,rgba(255,255,255,0) 12%,rgba(255,255,255,.30) 50%,rgba(255,255,255,0) 88%);
  transform:translateX(-200%) skewX(-16deg);animation:foilSweep 3.1s ease-in-out infinite}
/* longer rest phase — the band should read as light occasionally catching the foil, not a metronome */
@keyframes foilSweep{0%,52%{transform:translateX(-200%) skewX(-16deg)}84%,100%{transform:translateX(330%) skewX(-16deg)}}
.m-foilshine.off{display:none}

.m-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--aq1);margin-top:14px;font-weight:700;animation:hintB 1.6s infinite}
/* it *is* the .cta component — the hand-copied version had drifted (no press feedback,
   56px instead of 58px, no shine sweep). Now it only adds the hidden-until-revealed state. */
.m-claim{display:none;margin-top:18px}
.m-claim.in{animation:childIn .5s var(--spring) both}
/* re-state --shadow-btn: a bare box-shadow here would REPLACE .cta's, flattening the button
   onto the card at exactly the moment a keyboard user is on it (same pattern as .m-scratch) */
.m-claim:focus-visible{border-radius:99px;outline:3px solid var(--aq1);outline-offset:3px;box-shadow:var(--shadow-btn),0 0 0 7px rgba(14,165,233,.18)}
/* the modal must never be a dead end: an always-reachable dismiss, keyboard included.
   The mute toggle is its mirror on the left, so the header stays optically balanced. */
/* 44px: the smallest reliable touch target. The box is 44 and the PAINTED circle stays 36 —
   4px of padding plus background-clip:content-box. Order matters: `background-clip` has to
   come after any `background` shorthand, which resets it to border-box.
   Everything below uses the background-COLOR longhand for the same reason. */
.m-close,.m-mute{position:absolute;top:4px;width:44px;height:44px;border-radius:50%;border:0;padding:4px;
  background-color:var(--surface2);background-clip:content-box;color:var(--mut);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background-color .2s,transform .2s var(--spring),color .2s}
.m-close{right:4px;font-size:20px;font-weight:700;line-height:1}
.m-mute{left:4px}
.m-mute svg{width:17px;height:17px;fill:currentColor;display:block;pointer-events:none}
.m-close:hover,.m-mute:hover{background-color:#e2edf3;color:var(--ink)}
.m-close:active,.m-mute:active{transform:scale(.92)}
