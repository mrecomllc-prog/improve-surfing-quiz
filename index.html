/* the muted state reads as dimmed but stays ≥3:1 on the chip (AA non-text) */
.m-mute[aria-pressed="true"]{color:var(--mute)}
/* negative offset so the ring hugs the 36px painted circle, not the 44px hit box */
.m-close:focus-visible,.m-mute:focus-visible{border-radius:50%;outline:3px solid var(--aq1);outline-offset:-4px;box-shadow:0 0 0 5px rgba(14,165,233,.18)}

.tag-debug{position:fixed;bottom:8px;left:10px;font-size:10px;font-family:monospace;z-index:50;color:#7b96a4;display:none} /* hidden in production; add ?debug to the URL to show */

/* ---------- narrow phones (≤360px) ---------- */
@media (max-width:360px){
  #app{padding:8px 16px 36px}
  h1{font-size:25px}
  .intro-h{font-size:31px}
  /* the 46px icon circle gives back a little width on the smallest phones */
  .opt{gap:11px;padding:16px 14px}
  .opt .emoji{flex:0 0 40px;width:40px;height:40px;font-size:19px}
  /* the checkpoint read-out loses ~55px of inner width here: the two uppercase micro-labels
     ("RAIL & BOARD", "MEASURED LEVEL · N TECHNIQUE ANSWERS") are the only things that
     ellipsised, so they scale down rather than truncate */
  .mile h1{font-size:21px}
  .msl span{font-size:8px;letter-spacing:.02em}
  .mtop .mlk{font-size:8.5px;letter-spacing:.05em}
  .mtop .mlb{flex:0 0 40px;width:40px;height:40px;font-size:14px}
  .mnext .mnc span{font-size:10px;padding:3px 8px}
  /* .plans is a VERTICAL accordion — the carousel rules that used to live here (a
     calc(50% - 94px) inset plus flex:0 0 220px) survived the switch and were still live:
     every card rendered 220px wide in a 328px column, and the 220px basis landed on the
     COLUMN main axis, locking each collapsed card to 220px tall against 166px of content.
     360px is the modal Android width, so this was most of the Android traffic. */
  .plan{padding:20px 15px 16px}
  .plan .pprice{font-size:38px}
  .gauge{width:208px;height:208px}
  .bignum{font-size:60px}
  /* the scratch modal loses ~55px of inner width here: shrink the corner controls and
     tighten the kicker so "Founding member bonus" still clears them on one line */
  .modal-card{padding:22px 18px}
  .modal-h{font-size:21px}
  /* the painted circle drops to 32px; the 44px hit box does NOT — the padding absorbs it */
  .m-close,.m-mute{width:44px;height:44px;top:4px;padding:6px}
  .m-close{right:4px}.m-mute{left:4px}
  .m-close:focus-visible,.m-mute:focus-visible{outline-offset:-6px}
  .modal-kick{font-size:9.5px;letter-spacing:.1em;padding:0 34px;min-height:32px}
  .m-prize .ps{font-size:11px}
}

/* ---------- back control ---------- */
.backlink{position:absolute;left:16px;top:calc(9px + env(safe-area-inset-top));width:44px;height:44px;border-radius:16px;background:var(--card);box-shadow:var(--sh1);color:var(--ink);font-size:24px;font-weight:700;cursor:pointer;z-index:6;line-height:41px;text-align:center;display:none;transition:transform .25s var(--spring)} /* 44px tap target */
.backlink:active{transform:scale(.9)}
.backlink.show{display:block}
</style>
<!-- preview hook: ?jump=<stepId> jumps straight to a deep screen.
     (The old ?theme=a|b|c|d loader is gone — themes/*.css were written against the dark
     design and now fight the Glasswater palette.) -->
<script>(function(){var q=new URLSearchParams(location.search);
if(q.has('jump')){var j=document.createElement('script');j.src='preview-jump.js';j.defer=true;document.head.appendChild(j);}})();</script>
</head>
<body>
<div class="bgfx"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div id="shell">
  <span class="backlink" id="back" role="button" tabindex="0" aria-label="Go back" onclick="goBack()">‹</span>
  <div id="topbar">
    <div class="brand"><img class="mark" src="img/ta-logo-dark.png" alt="TA"><div class="wm">IMPROVE <b>SURFING</b></div></div>
    <div class="progress-wrap" id="progwrap" style="visibility:hidden">
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
      <div class="barrow"><div class="bar"><i id="barfill"></i><span id="barsurfer">🏄</span></div><div class="qcount" id="qcount"></div></div>
    </div>
  </div>
  <div id="app"></div>
</div>
<div class="tag-debug" id="tagdebug"></div>

<script>
/* ============================================================
   WHAT'S YOUR SURF SCORE? — Improve Surfing (prototype v1)
   Glasswater light theme · Plus Jakarta Sans · progressive capture · Stripe end.
   Engine adapted from the JDL Burn Factor quiz.
   ============================================================ */

const STEPS = [
  { id:'intro', type:'intro' },

  { id:'name', type:'text', field:'name', placeholder:'Your first name',
    eyebrow:"Let's start", title:'First — <span class="hl">what should we call you?</span>',
    sub:'So we can personalise your Surf Score.' },

  { id:'gender', type:'gender', q:true,
    eyebrow:'About you', title:'Which best describes you?' },

  { id:'age', type:'imgcards', q:true,
    eyebrow:'The time factor', title:"What's your age range?",
    sub:'Every year on your own is a year of <b>waves left on the table.</b> The sooner you fix your technique, the faster it compounds.',
    options:[
      {label:'18–29',val:'18–29',img:'age1'},
      {label:'30–39',val:'30–39',img:'age2'},
      {label:'40–49',val:'40–49',img:'age3'},
      {label:'50+',val:'50+',img:'age4'},
    ]},

  /* ═══ Section 1 · Your surfing today ═══ */
  { id:'q1', type:'single', q:true,

/* ---------- scoring (13-point diagnostic, Yugen-style 1–4 scale) ----------
   13 = LEVEL_QS (9 technique answers) + q3/q4/q15/q16. The UI says 13-point too. */
function scOf(id){ return (state._sc&&state._sc[id]!=null)?state._sc[id]:null; }
const LEVEL_QS=['q5','q6','q8','q9','q9b','q10','q12','q14','q14b'];
function levelAvg(){ let t=0,c=0; LEVEL_QS.forEach(q=>{const s=scOf(q); if(s!=null){t+=s;c++}}); return c?t/c:1; }
const LEVELS={1:'Foundation',2:'Directional Control',3:'Flow & Manoeuvring',4:'Mastery & Expression'};
const PILLARS={
  skill:{label:'Skill',qs:['q5','q8','q10','q14','q14b']},
  theory:{label:'Wave IQ',qs:['q6','q10','q14','q14b']},
  mindset:{label:'Mindset',qs:['q9','q9b','q12','q14']},
  ocean:{label:'Ocean Sense',qs:['q5','q6','q9']},
  fitness:{label:'Fitness',qs:['q3','q4']},
  equipment:{label:'Equipment',qs:['q15','q16']},
};
function pillarScores(){ const out={}; for(const k in PILLARS){ let t=0,c=0; PILLARS[k].qs.forEach(q=>{const s=scOf(q); if(s!=null){t+=s;c++}}); out[k]=c?Math.round(t/c*10)/10:null; } return out; }
const LIMITER_META={
  skill:{label:'Skill',fix:'technique-first coached sessions + surfskate drills'},
  theory:{label:'Wave IQ',fix:'video analysis + wave-reading theory'},
  mindset:{label:'Mindset',fix:'confidence coaching + apnea training'},
  ocean:{label:'Ocean Sense',fix:'lineup positioning work in guided sessions'},
  fitness:{label:'Fitness',fix:'paddle fitness + mobility programme'},
  equipment:{label:'Equipment',fix:'a board check + $200-off partner shapers'},
};
function limiterKey(){ const p=pillarScores(); let k=null,v=99; for(const key in p){ if(p[key]!=null&&p[key]<v){v=p[key];k=key;} } return k||'skill'; }
function computeScore(s){
  const avg=levelAvg();
  let sc=Math.round(avg/4*62); sc=Math.max(20,Math.min(58,sc));
  const lvl=Math.max(1,Math.min(4,Math.floor(avg+1e-9)));
  return {score:sc,potential:90,gap:90-sc,avg:Math.round(avg*10)/10,lvl,pillars:pillarScores(),limiter:limiterKey()};
}
const YEARS_STUCK={under_1yr:'a year','1_2yr':'2 years','3_5yr':'4 years','6_10yr':'6 years',over_10yr:'8 years'};
function computeProjection(s){
  // weeks to break through, faster with more sessions / higher commitment
  let weeks=22;
  if(s.sessions==='2+')weeks-=8; else if(s.sessions==='1-2')weeks-=4;
  if(s.commit==='allin')weeks-=4; else if(s.commit==='6mo')weeks-=2;
  if(levelAvg()<1.8)weeks+=2;
  weeks=Math.max(8,Math.min(24,weeks));
  return {weeks, stuck:YEARS_STUCK[s.q2]||'3 years'};
}

const INPUT=['single','gender','imgcards','text','num'];

   Keys are STEPS ids and nothing else: q7/q11/q13/q17/q18/'missing' were removed with

const DOT_SEC={name:0,gender:0,age:0,q1:0,q2:0,q3:0,q4:0,q5:0,q6:0,q8:0,q9:0,q9b:0,

function setProgress(step){
  const pw=document.getElementById('progwrap');
  const isInput=INPUT.includes(step.type);
  if(isInput){
    pw.style.visibility='visible';
    const all=inputSteps(), n=all.indexOf(step)+1;
    /* front-loaded curve (^0.5): the bar jumps fast on the first questions so it feels like a short quiz */
    const pct=Math.round(Math.pow(n/all.length,0.5)*100);
    document.getElementById('barfill').style.width=pct+'%';
    const surf=document.getElementById('barsurfer'); if(surf)surf.style.left=pct+'%';
    const qc=document.getElementById('qcount'); if(qc)qc.textContent='';   /* no "Question X of Y" — keep it feeling short */
    /* Glasswater signature #6: the live section's dot stretches into a 28px pill */
    const dots=document.getElementById('dots');
    if(dots){
      const sec=DOT_SEC[step.id]!=null?DOT_SEC[step.id]:Math.min(3,Math.floor((n-1)/all.length*4));
      [].forEach.call(dots.children,(d,i)=>d.classList.toggle('on',i===sec));
    }
  } else pw.style.visibility='hidden';
  /* the loader is a 4.2s transient that auto-advances — a back chevron on it is a control
     that undoes itself. (The old test excluded 'result', a screen that no longer exists.) */
  const NOBACK={loader:1,plans:1};
  document.getElementById('back').classList.toggle('show', idx>0&&!NOBACK[STEPS[idx].type]);
}
/* Skipping a conditional step has to drop whatever it once contributed: q9b/q14b stayed
   in _sc after the answer that unlocked them changed, poisoning levelAvg()/pillarScores()
   by up to ~19 Surf Score points. (The test can NOT live in scOf(): q14b's cond calls
   levelAvg(), which calls scOf('q14b') — infinite recursion.) */
function next(){ idx++;
  while(idx<STEPS.length&&STEPS[idx].cond&&!STEPS[idx].cond(state)){
    delete state._sc[STEPS[idx].id]; delete state[STEPS[idx].id]; idx++;
  }
  if(idx>=STEPS.length)idx=STEPS.length-1; render(); }
/* skips the loader the same way it skips a failed cond step: back from the score screen
   used to land on the loader, which immediately replays its 4.2s run and calls next()
   straight back to the score — a 4.7s round trip to nowhere. */
function goBack(){ if(idx<=0)return;
  do{ idx--; }
  while(idx>0&&((STEPS[idx].cond&&!STEPS[idx].cond(state))||STEPS[idx].type==='loader'));
  render(); }

    num:renderNum,snippet:renderSnippet,milestone:renderMilestone,

/* HTML-escape anything user-typed before it goes into an attribute or innerHTML:
   a name containing a quote used to terminate value="" and silently truncate the answer */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* alt is explicit: the gender/age cards are role=button divs whose accessible name comes
   from their contents, so an unlabelled <img> made screen readers read "img/male.jpg Man" */
function slot(name,ar,label,alt){ return `<img class="imgslot ${ar}" data-ar="${ar}" data-label="${label}" alt="${esc(alt||'')}" src="img/${name}.jpg" onerror="imgFallback(this)">`; }
function gslot(base,ar,label,alt){ const g=state.gender==='Woman'?'f':'m'; return slot(base+'-'+g,ar,label,alt); }

function renderText(el,step){
  const type=step.inputType||'text';
  let title=step.title; const nm=firstName();
  if(title.includes('{nm}')) title = nm ? title.replace('{nm}',nm+', ') : title.replace('{nm}','').replace(/^([a-z])/i,c=>c.toUpperCase());
  let fieldHtml;
  if(step.phone){
    /* paint the NATIONAL digits back, never the stored "+61 …": the field sits next to a
       "+61" chip, and saveText() re-prefixes on every submit — so a back-nav + Continue
       used to produce "+61 +61493447438", then "+61 +61+61493447438" */
    fieldHtml=`<div class="phonewrap">
        <span class="ccode"><img class="flag" src="https://flagcdn.com/au.svg" alt="AU"> +61</span>
        <input id="tf" type="tel" inputmode="tel" placeholder="${step.placeholder}" value="${esc(natPhone(state[step.field]))}" autocomplete="off">
      </div>`;
  } else {
    fieldHtml=`<div class="bigfield"><input id="tf" type="${type}" placeholder="${step.placeholder}" value="${esc(state[step.field]||'')}" autocomplete="off"></div>`;
  }
  el.innerHTML=`
    ${step.eyebrow?`<div class="eyebrow">${step.eyebrow}</div>`:''}
    <h1>${title}</h1>${step.sub?`<div class="sub">${step.sub}</div>`:''}
    ${fieldHtml}
    <div class="qgap"></div>
    <button class="cta" style="margin-top:0" onclick="saveText('${step.field}','${type}')">Continue →</button>
    ${step.privacy?`<div class="privacy"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4z"/></svg> Your details are safe and never shared.</div>`:''}`;
  const inp=el.querySelector('#tf'); setTimeout(()=>inp.focus(),120);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')saveText(step.field,type)});
  inp.addEventListener('input',()=>{ inp.classList.remove('err'); inp.removeAttribute('aria-invalid'); });
  if(step.phone){ inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9 ]/g,'');}); }
}
/* the stored value is canonical "+61 4xxxxxxxx"; this is the national form the field shows */
function natPhone(v){ return String(v==null?'':v).replace(/^\s*\+?61\s*/,'').trim(); }
function saveText(field,type){ let v=val('tf'); const ok = !v ? false : (type==='email' ? /.+@.+\..+/.test(v) : true);
  const i=document.getElementById('tf');
  if(!ok){ if(i){ i.classList.add('err'); i.setAttribute('aria-invalid','true'); i.focus(); } return; }
  if(i){ i.classList.remove('err'); i.removeAttribute('aria-invalid'); }
  /* strip any prefix ALREADY there before adding one — this has to be idempotent, because
     the back chevron is shown on the phone step and Continue can be pressed repeatedly */
  if(field==='phone'){ v='+61 '+v.replace(/\s/g,'').replace(/^\+?61/,'').replace(/^0/,''); }
  state[field]=v; next(); }

/* every consumer drops this into innerHTML, so it escapes here once */
function firstName(){ let nm=state.name?String(state.name).trim().split(' ')[0]:''; return (nm && /[a-zA-Z]/.test(nm)) ? esc(nm) : ''; }
function interp(t){ if(!t)return t; const nm=firstName();
  return t.replace('{nm}', nm?nm+', ':'').replace(/^([a-z])/,c=>c.toUpperCase()); }
/* ── pricing + founding discount (scratch) ── */

function wkNow(t){ return tierWk(t)*(1-(state._discount||0)); }
function money(n){ return 'A$'+(Number.isInteger(+n.toFixed(2))? n.toFixed(0): n.toFixed(2)); }
function buzz(ms){ try{ if(navigator.vibrate)navigator.vibrate(ms); }catch(e){} }

/* ── procedural sound — Web Audio only, zero asset files ─────────────────────
   The AudioContext is created on the FIRST user gesture (every autoplay policy
   rejects it before that), then reused and resume()'d if the OS suspended it.
   Every entry point is try/catch'd end to end: a blocked, missing or throttled
   AudioContext must never be able to break the reveal.
   No animation-frame callbacks — Web Audio schedules on its own clock. */
const SFX=(function(){
  let ctx=null, noise=null, muted=false;
  /* default ON — but a reduced-motion user gets silence unless they ask for it */
  try{ muted=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){}
  try{ const s=sessionStorage.getItem('isq_sfx_muted'); if(s!==null)muted=(s==='1'); }catch(e){}
  function ac(){
    try{
      if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return null; ctx=new AC(); }
      /* resume() returns a promise — a webview that refuses to resume rejects it, and the
         try/catch around this cannot catch that. Swallow it: unhandled rejections in an
         IG/FB webview are pure console noise the funnel doesn't need. */
      if(ctx.state==='suspended'&&ctx.resume){ const p=ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }
      return ctx;
    }catch(e){ return null; }
  }
  /* 60ms of decaying white noise, built once and re-triggered per tick */
  function noiseBuf(c){
    if(noise)return noise;
    const n=Math.max(1,Math.floor(c.sampleRate*.06)), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    noise=b; return b;
  }
  function note(c,out,freq,at,dur,peak,type){
    const o=c.createOscillator(); o.type=type||'triangle'; o.frequency.setValueAtTime(freq,at);
    const g=c.createGain();
    /* ramps on both edges — a bare start/stop clicks on every device */
    g.gain.setValueAtTime(.0001,at);
    g.gain.exponentialRampToValueAtTime(peak,at+.018);
    g.gain.exponentialRampToValueAtTime(.0001,at+dur);
    o.connect(g); g.connect(out); o.start(at); o.stop(at+dur+.02);
  }
  /* a single quiet grain of filtered noise — the caller throttles it to ~90ms */
  function scratch(){
    try{
      if(muted)return; const c=ac(); if(!c)return;
      const src=c.createBufferSource(); src.buffer=noiseBuf(c);
      src.playbackRate.value=.85+Math.random()*.5;
      const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500+Math.random()*1400; bp.Q.value=.9;
      const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=700;
      const g=c.createGain(), t=c.currentTime;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.032,t+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t+.075);
      src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(c.destination);
      src.start(t); src.stop(t+.09);
    }catch(e){}
  }
  /* the payoff — a D-major add9 arpeggio (D5 F#5 A5 D6) climbing over 255ms, then two
     sine partials as a shimmer tail. Rendered offline it peaks at .077 and is inaudible
     by 0.95s, so it clears both budgets (< .2 peak, < 1.2s) with room to spare. */
  function revealSfx(){
    try{
      if(muted)return; const c=ac(); if(!c)return;
      const t=c.currentTime+.02;
      const master=c.createGain(); master.gain.setValueAtTime(.13,t); master.connect(c.destination);
      /* a gentle roll-off so the triangles don't sound brittle on phone speakers */
      const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5200; lp.connect(master);
      [587.33,739.99,880.00,1174.66].forEach((f,i)=>note(c,lp,f,t+i*.085,.40,.55,'triangle'));
      note(c,lp,1760.00,t+.34,.90,.16,'sine');
      note(c,lp,2349.32,t+.42,.84,.10,'sine');
      master.gain.setValueAtTime(.13,t+1.0);
      master.gain.exponentialRampToValueAtTime(.0001,t+1.18);
    }catch(e){}
  }
  return{
    unlock:function(){ try{ ac(); }catch(e){} },
    scratch:scratch, reveal:revealSfx,
    isMuted:function(){ return muted; },
    setMuted:function(v){ muted=!!v; try{ sessionStorage.setItem('isq_sfx_muted',muted?'1':'0'); }catch(e){} }
  };
})();
function sfxScratch(){ try{ SFX.scratch(); }catch(e){} }
function sfxReveal(){ try{ SFX.reveal(); }catch(e){} }
/* arm the context on the first gesture of the session — by the time the scratch modal
   opens (auto, 850ms after the result screen) the user has tapped ~25 screens already */
(function(){
  const ev=['pointerdown','touchstart','keydown','click'];
  const arm=function(){ try{ SFX.unlock(); }catch(e){}
    try{ ev.forEach(t=>document.removeEventListener(t,arm,true)); }catch(e){} };
  try{ ev.forEach(t=>document.addEventListener(t,arm,true)); }catch(e){}
})();
const SPK_ON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.4 6.5 8.2H3.3v7.6h3.2L11 19.6z"/><path d="M15.1 8.7a4.6 4.6 0 0 1 0 6.6M17.9 5.9a8.4 8.4 0 0 1 0 12.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';

function paintMuteBtn(b){
  if(!b)return; const m=SFX.isMuted();
  b.innerHTML=m?SPK_OFF:SPK_ON;
  b.setAttribute('aria-pressed',m?'true':'false');
  b.setAttribute('aria-label',m?'Turn sound on':'Turn sound off');
  b.setAttribute('title',m?'Sound off':'Sound on');

function toggleSfx(b){
  SFX.setMuted(!SFX.isMuted());
  paintMuteBtn(b); buzz(6);
  if(!SFX.isMuted()) sfxScratch();   /* one tick confirms sound is back */
}
function fx(node,e,score){ /* ripple inside the card + emoji floating up from the tap point */
  buzz(9);
  const b=node.getBoundingClientRect();
  const cx=(e&&e.clientX)?e.clientX:b.left+b.width/2, cy=(e&&e.clientY)?e.clientY:b.top+b.height/2;
  const r=document.createElement('span'); r.className='ripple';
  r.style.left=(cx-b.left)+'px'; r.style.top=(cy-b.top)+'px';
  node.appendChild(r); setTimeout(()=>r.remove(),600);
  const f=document.createElement('span'); f.className='floatup';
  f.textContent=(score!=null&&score>=3)?'🤙':'✓';
  f.style.left=cx+'px'; f.style.top=cy+'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(),850);
}
/* Glasswater signature #8 on the funnel's most-repeated element: every option row carries
   a 46px soft circle. Scored options get a scale bar built from the score already in
   STEPS (no copy change); the rest get the wave mark, so the silhouette stays uniform. */

   decoration and told the user nothing. Same grid (24), stroke and weight throughout. */
const IC=p=>`<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0e7490" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

  /* local */
  local:IC('<path d="M12 21.4s6.9-5.6 6.9-11a6.9 6.9 0 1 0-13.8 0c0 5.4 6.9 11 6.9 11z"/><circle cx="12" cy="10.2" r="2.6"/>'),

  elsewhere:IC('<circle cx="12" cy="12" r="8.8"/><path d="M3.2 12h17.6"/><path d="M12 3.2c2.4 2.5 3.7 5.5 3.7 8.8S14.4 18.3 12 20.8c-2.4-2.5-3.7-5.5-3.7-8.8S9.6 5.7 12 3.2z"/>'),

function optIcon(o){
  if(o.emoji) return `<span class="emoji">${o.emoji}</span>`;
  if(OPT_ICONS[o.val]) return `<span class="emoji ic">${OPT_ICONS[o.val]}</span>`;

    return `<span class="emoji ic"><svg width="21" height="21" viewBox="0 0 21 21" aria-hidden="true">${
      H.map((h,i)=>`<rect x="${1+i*5}" y="${18-h}" width="3.4" height="${h}" rx="1.7" fill="${i<o.score?'#0e7490':'rgba(14,116,144,.22)'}"/>`).join('')}</svg></span>`;

function renderSingle(el,step){
  /* the .qgap pair is the option screens' share of the fix the checkpoint got: a 3-option
     screen used to stop mid-page with ~400px of blank below it at 430x900. The gaps absorb
     the slack above and below the stack (60/40) instead of dumping it all at the bottom. */
  el.innerHTML=`${step.eyebrow?`<div class="eyebrow">${step.eyebrow}</div>`:''}<h1>${interp(step.title)}</h1>${step.sub?`<div class="sub">${interp(step.sub)}</div>`:''}<div class="qgap t"></div><div class="opts" role="radiogroup"></div><div class="qgap"></div>`;
  const opts=el.querySelector('.opts');
  step.options.forEach(o=>{
    const b=document.createElement('button'); b.type='button'; b.className='opt'+(state[step.id]===o.val?' sel':'');
    b.setAttribute('role','radio'); b.setAttribute('aria-checked',state[step.id]===o.val?'true':'false');
    b.innerHTML=`<span class="tick"></span>${optIcon(o)}<span class="txt">${o.label}</span>`;
    b.onclick=(e)=>{ state[step.id]=o.val; if(o.score!=null)state._sc[step.id]=o.score;
      fx(b,e,o.score);
      opts.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-checked','false');});
      b.classList.add('sel'); b.setAttribute('aria-checked','true');
      const from=idx; setTimeout(()=>{if(idx===from)next()},430); };
    opts.appendChild(b);
  });
}
const NUM_ICON={height_cm:'📏',weight_kg:'⚖️'};
function renderNum(el,step){
  el.innerHTML=`${step.eyebrow?`<div class="eyebrow">${step.eyebrow}</div>`:''}<h1>${interp(step.title)}</h1>${step.sub?`<div class="sub">${interp(step.sub)}</div>`:''}
    <div class="numrow">${step.fields.map(f=>`<div class="field numfield"><label>${f.label}</label><span class="ni">${NUM_ICON[f.key]||''}</span><input id="nf_${f.key}" type="number" inputmode="numeric" min="${f.min}" max="${f.max}" placeholder="${f.placeholder}" value="${state[f.key]||''}"></div>`).join('')}</div>

/* `advancing` is set by claimDiscount(), which is about to navigate: don't pull focus
   (and the scroll position) onto a button that is 560ms from being torn down. */
function closeScratchModal(advancing){
  const ov=document.getElementById('scratchModal'); if(!ov)return;
  if(ov.__esc)document.removeEventListener('keydown',ov.__esc);
  /* the canvas listeners die with the canvas node; this one is window-scoped and would
     otherwise outlive the modal, pinning the whole backing store (~1MB at DPR 2) per open */

  if(ov.__fb)clearTimeout(ov.__fb);
  /* strip every id on the way out. The node lives another 300ms while it fades, and it
     sits EARLIER in the document than any replacement — so a stale #mClaim/#mScratchCanvas

     the Reopen link now makes reachable. (openScratchModal's own #scratchModal guard also

function initScratch(){
  const cv=document.getElementById('mScratchCanvas'); if(!cv)return;
  /* clientWidth/Height are transform-independent; getBoundingClientRect() returned the

     small and every scratch landed right of the finger. Also scale for DPR. */
  const w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h){ setTimeout(initScratch,60); return; }

     mid-height. In destination-out the SOURCE alpha is the eraser, so both fill() passes
     below were erasing nothing at the centre of the panel and only the stroke was working:
     a tap with no drag did nothing at all, and the feathered edge never existed.
     Opaque black on both channels — ctx.globalAlpha alone now controls the feather. */

       job, and leaving it on would sweep a white band across the exposed prize */
    if(!touched){ touched=true; const sh=document.getElementById('mFoilShine'); if(sh)sh.classList.add('off'); }
    /* a feathered edge (wide soft pass + solid core) reads as foil coming away;
       the connecting stroke stops fast drags leaving a dotted trail */

       the getImageData sample ride the same 90ms cadence — both are expensive per-move. */
    const now=Date.now();

     handler is parked on the overlay for closeScratchModal() to remove — see the note there */
  const onUp=()=>{drawing=false;lastP=null};

/* ── the foil ───────────────────────────────────────────────────────────────
   Brushed metal, painted once: a diagonal ramp (cool silver with one warm stop),
   a specular band laid across it, a 4px hatch, five swirl arcs and a top/bottom
   vignette. ~150 draw ops, no assets, no rAF. */
function paintFoil(ctx,w,h){
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#aab9c6');  g.addColorStop(.14,'#dde5eb'); g.addColorStop(.28,'#95a7b5');
  g.addColorStop(.44,'#eef3f7'); g.addColorStop(.55,'#c3ced8'); g.addColorStop(.66,'#d9d2c6');
  g.addColorStop(.78,'#9dafbd'); g.addColorStop(.90,'#ced9e1'); g.addColorStop(1,'#a3b3c1');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

  /* specular highlight band, rotated off the horizontal */
  ctx.save();
  ctx.translate(w/2,h/2); ctx.rotate(-.42); ctx.translate(-w/2,-h/2);
  const s=ctx.createLinearGradient(0,h*.16,0,h*.64);
  s.addColorStop(0,'rgba(255,255,255,0)'); s.addColorStop(.5,'rgba(255,255,255,.5)'); s.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=s; ctx.fillRect(-w*.6,h*.16,w*2.2,h*.48);
  ctx.restore();

  /* brushed hatch — alternating light/dark hairlines on a 4px diagonal pitch */
  ctx.save(); ctx.lineWidth=1; let k=0;
  for(let i=-h;i<w+h;i+=4){
    ctx.strokeStyle=(k++%2)?'rgba(255,255,255,.16)':'rgba(20,44,58,.07)';
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i-h,h); ctx.stroke();
  }
  ctx.restore();

  /* wide swirl arcs — the circular grain a struck foil actually has */
  ctx.save(); ctx.lineWidth=1.4;
  for(let i=0;i<5;i++){
    ctx.strokeStyle=(i%2)?'rgba(255,255,255,.14)':'rgba(20,44,58,.06)';
    ctx.beginPath(); ctx.arc(w/2,h*(1.9+i*.22),h*(1.5+i*.2),Math.PI*1.18,Math.PI*1.82); ctx.stroke();
  }
  ctx.restore();

  /* seat it in the card: light at the top edge, shade at the bottom */
  const v=ctx.createLinearGradient(0,0,0,h);
  v.addColorStop(0,'rgba(255,255,255,.28)'); v.addColorStop(.5,'rgba(255,255,255,0)'); v.addColorStop(1,'rgba(12,36,48,.17)');
  ctx.fillStyle=v; ctx.fillRect(0,0,w,h);

  paintFoilLabel(ctx,w,h);
}
/* canvas has no letter-spacing on every engine we ship to (Safari only shipped
   ctx.letterSpacing in 17.4), so track the label by hand. Returns the drawn width. */
function trackedText(ctx,txt,cx,y,tr){
  let total=0,i;
  for(i=0;i<txt.length;i++) total+=ctx.measureText(txt[i]).width+tr;
  total-=tr;
  let x=cx-total/2;
  for(i=0;i<txt.length;i++){ ctx.fillText(txt[i],x,y); x+=ctx.measureText(txt[i]).width+tr; }
  return total;
}
function paintFoilLabel(ctx,w,h){
  const cx=w/2, cy=h/2;
  /* a struck coin, drawn — an emoji glyph re-renders differently on every platform */
  const r=Math.max(13,Math.min(19,h*.11)), coinY=cy-h*.13;
  ctx.save();
  const cg=ctx.createLinearGradient(cx-r,coinY-r,cx+r,coinY+r);
  cg.addColorStop(0,'#f6f9fb'); cg.addColorStop(.48,'#bfccd7'); cg.addColorStop(1,'#eef3f7');
  ctx.beginPath(); ctx.arc(cx,coinY,r,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
  ctx.lineWidth=1.6; ctx.strokeStyle='rgba(14,60,80,.30)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,coinY,r-4,0,Math.PI*2); ctx.lineWidth=1; ctx.strokeStyle='rgba(14,60,80,.18)'; ctx.stroke();
  /* the brand mark inside the coin: one wave */
  ctx.beginPath();
  ctx.moveTo(cx-r*.48,coinY+r*.12);
  ctx.bezierCurveTo(cx-r*.20,coinY-r*.26,cx-r*.02,coinY+r*.36,cx+r*.22,coinY+r*.02);
  ctx.bezierCurveTo(cx+r*.34,coinY-r*.14,cx+r*.40,coinY-r*.12,cx+r*.50,coinY-r*.04);
  ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='rgba(12,86,112,.72)'; ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='middle';
  /* embossed: a light pass one pixel low, the dark pass on top */
  const ly=cy+h*.12;
  ctx.font="800 13px 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif";
  ctx.fillStyle='rgba(255,255,255,.6)'; trackedText(ctx,'SCRATCH HERE',cx,ly+1,1.6);
  ctx.fillStyle='rgba(13,46,62,.74)';
  const lw=trackedText(ctx,'SCRATCH HERE',cx,ly,1.6);
  /* hairlines flanking the label */
  ctx.strokeStyle='rgba(13,46,62,.22)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(cx-lw/2-26,ly); ctx.lineTo(cx-lw/2-11,ly);
  ctx.moveTo(cx+lw/2+11,ly); ctx.lineTo(cx+lw/2+26,ly);
  ctx.stroke();
  ctx.font="700 8.5px 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif";
  ctx.fillStyle='rgba(13,46,62,.45)'; trackedText(ctx,'DRAG ACROSS THE PANEL',cx,ly+h*.11,1.4);
  ctx.restore();
}
function reveal(){
  const c=document.getElementById('mClaim');
  /* per-modal guard: the gesture, the keyboard path and the 8s fallback can all race */
  if(!c||c.__done)return; c.__done=true;
  const cv=document.getElementById('mScratchCanvas'); if(cv){cv.style.transition='opacity .5s';cv.style.opacity=0;setTimeout(()=>cv.remove(),500);}
  const sh=document.getElementById('mFoilShine'); if(sh)sh.classList.add('off');
  const pz=document.getElementById('mPrize'); if(pz)pz.classList.add('revealed');
  const h=document.getElementById('mHint'); if(h)h.style.display='none';
  c.style.display='block'; c.classList.add('in');
  burstConfetti(); buzz(18); sfxReveal();
  /* the payoff must be one Tab away — but only once it has settled */
  setTimeout(()=>{ try{ if(document.getElementById('mClaim')===c&&c.focus)c.focus(); }catch(e){} },420);
}
function claimDiscount(){
  state._discount=0.10;
  closeScratchModal(true);
  /* already on the plans screen — re-render so all four cards, the strike-throughs
     and the sticky bar pick the discount up */
  if(STEPS[idx]&&STEPS[idx].type==='plans') render();
}

/* the Glasswater check: a drawn mark inside a soft filled circle (glasswater.html:575) */
const TICK_SVG='<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="rgba(8,145,178,.16)"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#0891b2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const WAVE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c2.2 0 2.2-1.8 4.5-1.8S9.8 14 12 14s2.2-1.8 4.5-1.8S18.8 14 21 14"/><path d="M3 19c2.2 0 2.2-1.8 4.5-1.8S9.8 19 12 19s2.2-1.8 4.5-1.8S18.8 19 21 19"/></svg>';
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function planCard(k,rec,d){
  const t=TIERS[k]; const sel=state._sel===k;
  /* the whole 12-item list ships in the DOM; .pbody keeps it at 0fr until opened,
     so the list of four stays scannable but nothing is hidden from the buyer */
  return `<div class="plan${sel?' sel open':''}" data-k="${k}" role="button" tabindex="0"
       aria-expanded="${sel?'true':'false'}" onclick="selectPlan(this,'${k}',1)">
      ${rec===k?`<span class="pbadge">★ Your match</span>`:''}
      <span class="psel"></span>
      <span class="pname">${t.name}</span>
      ${d?`<span class="pold">was ${t.price}/wk</span>`:''}
      <span class="pprice"><i>A$</i>${money(wkNow(t)).slice(2)}<em>/wk</em></span>
      <span class="psess">${WAVE_SVG}${t.sessions}</span>
      <span class="ptoggle">${CHEV}<span class="ptxt">${sel?'Hide details':"What's included"}</span></span>
      <div class="pbody"><div><span class="pfeat">${
        t.inc.map(f=>`<span>${TICK_SVG}<em style="font-style:normal">${f}</em></span>`).join('')
      }</span></div></div>
    </div>`;
}

function clearCtaBar(){ const b=document.getElementById('ctabar'); if(b)b.remove(); document.body.classList.remove('has-bar'); }
function mountCtaBar(){
  clearCtaBar();
  const t=TIERS[state._sel]||TIERS[pickTier(state)];
  const bar=document.createElement('div'); bar.className='ctabar'; bar.id='ctabar';
  /* the tier name lives on the trust line, not in the button: at 17px/800 the old label
     wrapped to two lines for Elite / Foundation / Consistency — i.e. for most selections */
  /* every text run is wrapped: .paytrust is a flex row with gap:7px, so bare text nodes and
     bare middots each became their own flex item and collected 7px of stray air — and at
     375/360 the trailing item wrapped onto a second line that began with a naked "·" */
  bar.innerHTML=`<button class="cta" id="payBtn" onclick="payTier()">Join now → <span id="payprice">${money(wkNow(t))}</span>/week</button>
    <div class="paytrust"><span aria-hidden="true">🔒</span><span><span id="payname">${t.name}</span> · secure checkout via Stripe</span></div>`;
  document.body.appendChild(bar);
  setTimeout(()=>document.body.classList.add('has-bar'),40);   /* slide it up on enter */
}
function renderPlans(el){
  const rec=state._tier||pickTier(state); if(!state._sel)state._sel=rec;
  state._tier=rec;
  /* the bonus is the last beat before price: open it over the plans, and claiming
     simply repaints them — there is no separate result screen to bounce through */
  if(!state._discount&&!state._bonusSeen){ state._bonusSeen=1; setTimeout(()=>openScratchModal(),700); }
  /* the recommended tier goes FIRST. Fixed cheapest-first put the badged, pre-selected,
     pre-expanded match card at y=834 on an 812px viewport — entirely below the fold on
     first paint — while the sticky bar quoted its price against a A$99 card on screen. */
  const order=[rec].concat(['foundation','swell','consistency','elite'].filter(k=>k!==rec));
  const nm=firstName(); const d=state._discount||0;
  el.classList.add('padbar');   /* keeps the sticky bar off the content */
  el.innerHTML=`
    <div class="eyebrow">Choose your plan</div>
    <h1>${nm?nm+', choose':'Choose'} your <span class="hl">programme.</span></h1>
    <div class="sub" style="margin-bottom:14px">Your match is pre-selected — but pick whichever fits you best.</div>
    ${d?`<div class="disc-banner"><span class="disc-badge">✓ 10% founding discount applied to all plans</span></div>`:''}
    <div class="scarce" style="margin:0"><span class="dotr"></span><span>Founding member intake</span></div>
    <div class="plans">${order.map(k=>planCard(k,rec,d)).join('')}</div>
    <div class="guar" style="margin-top:4px"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4z"/></svg> Founding member intake · billed weekly in A$</div>
    `;
  mountCtaBar();
}


function selectPlan(node,k,fromTap){
  state._sel=k;
  document.querySelectorAll('.plan').forEach(p=>{
    p.classList.remove('sel','open'); p.setAttribute('aria-expanded','false');
    const tx=p.querySelector('.ptxt'); if(tx)tx.textContent="What's included";
  });
  node.classList.add('sel','open'); node.setAttribute('aria-expanded','true');
  const tx=node.querySelector('.ptxt'); if(tx)tx.textContent='Hide details';
  const t=TIERS[k];
  const pp=document.getElementById('payprice'); if(pp)pp.textContent=money(wkNow(t));
  const pn=document.getElementById('payname');  if(pn)pn.textContent=t.name;
  if(fromTap) buzz(9);
  updateDebug();
}
function payTier(){ const t=TIERS[state._sel]; alert('(prototype) Opens the Stripe checkout for '+t.name+' — '+money(wkNow(t))+'/week.\nURL: '+t.url); }
function burstConfetti(n){
  const cols=['#0891b2','#0ea5e9','#38bdf8','#fb923c','#0f2530'];   /* Glasswater palette */
  for(let i=0;i<(n||70);i++){ const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*2)+'s'; c.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),4200); }
}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function animateNum(node,from,to,dur,fmt){const t0=performance.now();const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/dur),e=1-Math.pow(1-p,3);node.textContent=fmt(from+(to-from)*e);if(p>=1)clearInterval(iv);},40);}
/* the gender/age cards, the skip link and the back chevron are divs with onclick.
   Enter/Space must fire them like a real button for keyboard + switch-control users.
   (window.event inside pickGender/pickCard then has clientX 0 → fx() falls back to
   the element centre, which is exactly what we want.) */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar')return;
  const t=e.target;
  if(!t||!t.getAttribute||t.getAttribute('role')!=='button')return;
  if(t.tagName==='BUTTON'||t.tagName==='A')return;
  e.preventDefault(); t.click();
});
function updateDebug(){if(!DEBUG)return;const el=document.getElementById('tagdebug');el.style.display='block';const sc=state._score?state._score.score:'—';const tier=state._tier||(state.commit?pickTier(state):'—');el.textContent=`[debug] lvl:${levelAvg().toFixed(2)} · score:${sc} · lim:${limiterKey()} · tier:${tier}`;}
render();
</script>
